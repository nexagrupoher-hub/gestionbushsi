/* ------------------- entrar con la cuenta de Google -------------------
   Sirve para cuentas mezcladas (Gmail sueltas y de dominio propio): Google
   confirma quién es, y el conector chequea que ese correo esté en la hoja
   Usuarios. El navegador nunca decide nada: manda el comprobante de Google
   y el .gs lo verifica contra Google antes de dejar entrar. */
function googleClientId(){ return (localStorage.getItem('GF_GOOGLE_ID')||'').trim(); }
function googleObligatorio(){ return localStorage.getItem('GF_GOOGLE_SOLO')==='1'; }
function cargarGoogle(alListo){
  if(window.google && window.google.accounts && window.google.accounts.id) return alListo();
  if(document.getElementById('gsi-script')) { setTimeout(function(){ cargarGoogle(alListo); }, 300); return; }
  var s = document.createElement('script');
  s.id='gsi-script'; s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
  s.onload = alListo;
  s.onerror = function(){ S.error='No se pudo cargar el botón de Google (¿sin internet?). Entrá con usuario y PIN.'; pintar(); };
  document.head.appendChild(s);
}
function botonGoogle(caja){
  var cid = googleClientId(); if(!cid) return;
  cargarGoogle(function(){
    try{
      google.accounts.id.initialize({ client_id: cid, callback: function(resp){
        S.cargando = true; S.error=''; pintar();
        var ped = { accion:'entrar_google', idtoken: resp.credential }; if(S.clave) ped.clave = S.clave;
        apiPost(ped, function(j){
          S.cargando = false;
          if(!j || !j.token){ S.error = 'Google confirmó tu cuenta pero la planilla no la reconoció.'; pintar(); return; }
          S.token = j.token; localStorage.setItem(LS.tok, j.token);
          S.usuario = j.usuario; S.permServidor = j.permisos || null; S.error='';
          localStorage.setItem(LS.ses, S.usuario.usuario);
          fijarEmpresa(j.empresa || S.empresaEntrada);
          traer();
        }, function(err){ S.cargando=false; S.error = err; pintar(); });
      }});
      google.accounts.id.renderButton(caja, { theme:'outline', size:'large', width:280, text:'signin_with', locale:'es' });
    }catch(e){ caja.innerHTML = '<div class="mini">No se pudo dibujar el botón de Google: '+esc(e.message)+'</div>'; }
  });
}

/* ------------------- código de acceso de la empresa -------------------
   Cada empresa puede tener su código (Mi empresa → Empresas y bases). Si
   alguna lo tiene, antes del usuario y PIN se pide el código: el conector no
   entrega ni la lista de usuarios sin él. La persona queda trabajando en la
   empresa de ese código. */
function fijarEmpresa(emp){
  if(!emp || !emp.codigo){ S.empresaFija=''; localStorage.removeItem(LS.empFija); return; }
  S.empresaFija = emp.codigo; S.empresa = emp.codigo;
  localStorage.setItem(LS.empFija, emp.codigo); localStorage.setItem(LS.emp, emp.codigo);
}
function salir(){
  S.usuario=null; S.token=''; S.permServidor=null; S.empresaEntrada=null;
  localStorage.removeItem(LS.ses); localStorage.removeItem(LS.tok);
  fijarEmpresa(null);
  /* vuelvo a pedir la lista de usuarios: si el conector exige código, la
     pide con el que quedó guardado en esta computadora */
  S.db.Usuarios = [];
  S.cfgOk=false;
  traer();
}
function pantallaCodigo(){
  var w = portada();
  var c = el('div',{cls:'login'});
  c.innerHTML = (logoDe('*')?'<img class="logoemp" src="'+logoDe('*')+'">':isoHtml(marcaNombre()))+'<h1>'+esc(marcaNombre())+'</h1><p>Escribí el código de acceso de tu empresa</p>';
  if(S.error) c.appendChild(el('div',{cls:'err'}, esc(S.error)));
  if(S.cargando){ c.appendChild(el('div',{cls:'mini'},'Comprobando…')); w.appendChild(c); return w; }
  var inp = el('input',{type:'password', cls:'pin codigo', maxlength:'40', placeholder:'••••••', autocomplete:'off'});
  c.appendChild(el('div',{cls:'campo',style:'text-align:left'},'<label>Código de acceso</label>').appendChild(inp).parentNode);
  var seguir = function(){
    var v = inp.value.trim(); if(!v) return;
    S.error='';
    if(S.exigeClave){          /* lo controla el conector: sin código no baja ni la lista de usuarios */
      S.cargando = true; pintar();
      pedirUsuarios(v, function(){ S.cargando=false; pintar(); });
      return;
    }
    var e = claveLocal(v);     /* conector viejo: se controla acá */
    if(!e){ S.error='Código de acceso incorrecto.'; pintar(); return; }
    S.clave = v; S.empresaEntrada = e; localStorage.setItem(LS.clave, v); pintar();
  };
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') seguir(); });
  c.appendChild(el('button',{cls:'btn pri', style:'width:100%;justify-content:center', onclick:seguir},'Continuar'));
  c.appendChild(el('div',{cls:'mini',style:'margin-top:14px'},'El código te lo da el administrador de tu empresa.<br><b>'+esc(GF_VERSION)+'</b>'));
  w.appendChild(c);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 50);
  return w;
}

function pantallaLogin(){
  /* con el conector viejo, el código se controla acá contra la columna clave_acceso */
  if(exigeClaveLocal() && !S.empresaEntrada && S.clave){ var e0 = claveLocal(S.clave); if(e0) S.empresaEntrada = e0; else { S.clave=''; localStorage.removeItem(LS.clave); } }
  if((S.exigeClave || exigeClaveLocal()) && !S.empresaEntrada) return pantallaCodigo();

  var w = portada();
  var c = el('div',{cls:'login'});
  c.innerHTML = (logoDe('*')?'<img class="logoemp" src="'+logoDe('*')+'">':isoHtml(marcaNombre()))+'<h1>'+esc(marcaNombre())+'</h1><p>'+(S.planilla?esc(S.planilla):'Entrá con tu usuario y PIN')+'</p>';
  if(S.empresaEntrada){
    var ce = el('div',{cls:'emp-entrada'}, '<b>'+esc(S.empresaEntrada.nombre)+'</b> · <a>cambiar de empresa</a>');
    ce.querySelector('a').addEventListener('click', function(){
      S.clave=''; S.empresaEntrada=null; S.error=''; localStorage.removeItem(LS.clave);
      if(S.exigeClave) S.db.Usuarios = [];
      pintar();
    });
    c.appendChild(ce);
  }
  if(S.error) c.appendChild(el('div',{cls:'err'}, esc(S.error)));
  if(S.cargando){ c.appendChild(el('div',{cls:'mini'},'Trayendo los datos de la planilla…')); w.appendChild(c); return w; }

  if(googleClientId()){
    var caja = el('div',{style:'display:flex;justify-content:center;margin-bottom:6px;min-height:44px'});
    c.appendChild(caja);
    botonGoogle(caja);
    if(googleObligatorio()){
      c.appendChild(el('div',{cls:'mini',style:'margin-top:10px'},'Se entra con la cuenta de Google. Tu correo tiene que estar cargado en la hoja Usuarios.<br><b>'+esc(GF_VERSION)+'</b>'));
      w.appendChild(c); return w;
    }
    c.appendChild(el('div',{cls:'mini',style:'margin:10px 0 4px;text-align:center'},'— o entrá con usuario y PIN —'));
  }

  var us = T('Usuarios').filter(function(u){ return u.activo!=='No'; });
  if(!us.length){
    c.appendChild(el('div',{cls:'aviso'},'La hoja Usuarios está vacía. Cargá al menos uno en la planilla (o usá "2. Cargar datos de ejemplo").'));
    c.appendChild(el('button',{cls:'btn', style:'width:100%;justify-content:center', onclick:function(){ traer(); }},'Reintentar'));
    w.appendChild(c); return w;
  }
  var sel = el('select');
  us.forEach(function(u){ sel.appendChild(el('option',{value:u.usuario}, esc(u.nombre)+' — '+esc(u.rol))); });
  c.appendChild(el('div',{cls:'campo',style:'text-align:left'},'<label>Usuario</label>').appendChild(sel).parentNode);
  var pin = el('input',{type:'password', cls:'pin', maxlength:'8', placeholder:'••••'});
  c.appendChild(el('div',{cls:'campo',style:'text-align:left'},'<label>PIN</label>').appendChild(pin).parentNode);
  var entrar = function(){
    var u = null; us.forEach(function(x){ if(x.usuario===sel.value) u=x; });
    if(!u) return;
    var local = function(){
      if(String(u.pin||'') !== pin.value.trim()){ S.error='PIN incorrecto para '+u.nombre+'.'; pintar(); return; }
      if(S.empresaEntrada && String(u.empresa||'').trim() && String(u.empresa).trim()!==S.empresaEntrada.codigo){ S.error='Ese usuario no pertenece a '+S.empresaEntrada.nombre+'.'; pintar(); return; }
      S.usuario = u; S.error=''; localStorage.setItem(LS.ses, u.usuario);
      fijarEmpresa(S.empresaEntrada); pintar();
    };
    /* si el conector ya tiene el bloque de permisos, el PIN lo revisa el servidor
       y vuelve con un token. Si no lo tiene, seguimos como siempre. */
    S.cargando = true; pintar();
    var ped = { accion:'entrar', usuario:u.usuario, pin:pin.value.trim() }; if(S.clave) ped.clave = S.clave;
    apiGet(ped, function(j){
      S.cargando = false;
      if(!j || !j.token){ local(); return; }
      S.token = j.token; localStorage.setItem(LS.tok, j.token);
      S.usuario = j.usuario || u; S.permServidor = j.permisos || null; S.error='';
      localStorage.setItem(LS.ses, S.usuario.usuario);
      fijarEmpresa(j.empresa || S.empresaEntrada);
      traer();
    }, function(err){
      S.cargando = false;
      if(/pin incorrecto|dado de baja|inexistente|no pertenece|c[oó]digo de acceso/i.test(String(err))){
        S.error = err;
        if(/c[oó]digo de acceso/i.test(String(err))){ S.clave=''; S.empresaEntrada=null; localStorage.removeItem(LS.clave); }
        pintar(); return;
      }
      local();   /* el conector viejo no conoce "entrar": chequeo acá como antes */
    });
  };
  pin.addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });
  c.appendChild(el('button',{cls:'btn pri', style:'width:100%;justify-content:center', onclick:entrar},'Entrar'));
  c.appendChild(el('div',{cls:'mini',style:'margin-top:14px'},'<b>'+esc(GF_VERSION)+'</b>'));
  w.appendChild(c);
  return w;
}

function guardarFila(hoja, obj){
  if(!S.db[hoja]) S.db[hoja]=[];
  if(!obj.id) obj.id = idNuevo();
  var i = -1; S.db[hoja].forEach(function(r,k){ if(String(r.id)===String(obj.id)) i=k; });
  if(i>=0) S.db[hoja][i] = obj; else S.db[hoja].push(obj);
}
function borrarFila(hoja, obj){
  S.db[hoja] = (S.db[hoja]||[]).filter(function(r){ return String(r.id)!==String(obj.id); });
}

/* ---- formulario armado solo, a partir del esquema de la planilla ---- */
function campoDe(col, valor, alCambiar){
  var c = el('div',{cls:'campo'});
  c.appendChild(el('label',null, esc(col.titulo)));
  var ent;
  if(col.val && col.val.indexOf('l:')===0){
    ent = el('select');
    ent.appendChild(el('option',{value:''},'—'));
    ((S.listas||{})[col.val.substring(2)]||[]).forEach(function(v){
      var o = el('option',{value:v}, esc(v)); if(String(valor)===String(v)) o.selected=true; ent.appendChild(o);
    });
  } else if(col.val && col.val.indexOf('r:')===0){
    var p = col.val.substring(2).split('.');
    ent = el('select');
    ent.appendChild(el('option',{value:''},'—'));
    T(p[0]).forEach(function(r){
      var etiq = r[p[1]] + (r.nombre? ' · '+r.nombre : (r.descripcion? ' · '+r.descripcion : (r.razon_social? ' · '+r.razon_social : (r.patente? ' · '+r.patente:''))));
      var o = el('option',{value:r[p[1]]}, esc(etiq)); if(String(valor)===String(r[p[1]])) o.selected=true; ent.appendChild(o);
    });
  } else if(/^(obs|descripcion|falla|diagnostico|trabajo|detalle|no_conformes|sintoma|causa|solucion|alcance|permisos)$/.test(col.clave)){
    ent = el('textarea', null, esc(valor===undefined?'':valor));
  } else if(col.fmt==='e'||col.fmt==='n'||col.fmt==='$'||col.fmt==='%'){
    ent = el('input',{type:'number', step:(col.fmt==='e'?'1':'0.01'), value:(valor===''||valor===undefined?'':valor)});
  } else {
    ent = el('input',{value:(valor===undefined||valor===null?'':valor)});
    if(/fecha|vencimiento|emision|entrega|apertura|cierre|inicio|fin|despacho|recepcion$/.test(col.clave)) ent.placeholder='aaaa-mm-dd';
    if(/^hora/.test(col.clave)) ent.placeholder='hh:mm';
  }
  ent.addEventListener('change', function(e){ alCambiar(col.fmt==='t'? e.target.value : (e.target.value===''?'':num(e.target.value))); });
  ent.addEventListener('input', function(e){ alCambiar(col.fmt==='t'? e.target.value : (e.target.value===''?'':num(e.target.value))); });
  c.appendChild(ent);
  return c;
}

function formGenerico(hoja, registro, alTerminar){
  if(!puede(S.vista,'cargar')){ alert('Tu usuario puede mirar este módulo pero no cargar ni editar.'); return; }
  var esq = (S.esq||{})[hoja];
  if(!esq){
    if(!S.esq){
      aviso('Descargando la estructura de la planilla…');
      pedirEsquema(function(ok, err){
        if(ok) formGenerico(hoja, registro, alTerminar);
        else { alert('No pude bajar la estructura de la planilla: '+(err||'sin respuesta')+'\n\nProbá de nuevo en unos segundos.'); }
      });
      return;
    }
    alert('La planilla no tiene la hoja "'+hoja+'". Corré "Crear / reparar la plantilla" desde el menú Gestión de Flota de la planilla.'); return;
  }
  /* las tablas pasan la fila "vestida" (Object.create) con columnas calculadas _km, _prox…:
     hay que copiar también lo heredado (los datos reales) y dejar afuera lo calculado */
  var obj = {};
  if(registro){ for(var k in registro){ if(k.charAt(0)!=='_') obj[k]=registro[k]; } }
  var nuevo = !registro || !registro.id;
  var cuerpo = el('div');
  cuerpo.appendChild(el('div',{cls:'mini',style:'margin-bottom:12px'}, esc(esq.desc||'')));

  /* la configuración de ejes se elige con el dibujo, no escribiendo un patrón */
  if(hoja==='Vehiculos'){
    var bloque = el('div',{style:'border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:14px'});
    bloque.appendChild(el('label',null,'Configuración de ejes'));
    var resumen = el('div',{cls:'mini',style:'margin:-2px 0 10px'});
    var pintarResumen = function(){
      resumen.innerHTML = obj.ruedas
        ? '<b style="color:var(--t1)">'+esc(nombreConfig(obj.ruedas))+'</b> · '+esc(patronDe(obj.ruedas))+' · '+num(obj.ejes)+' ejes · '+totalRuedas(obj.ruedas)+' posiciones de neumático'
        : 'Elegí la configuración: de acá salen las posiciones donde se montan las cubiertas.';
    };
    pintarResumen();
    bloque.appendChild(resumen);
    bloque.appendChild(selectorEjes(obj.ruedas, function(patron, ejes){
      obj.ruedas = patron; obj.ejes = ejes; pintarResumen();
    }));
    cuerpo.appendChild(bloque);
  }

  var f = el('div',{cls:'fila'});
  esq.cols.forEach(function(col){
    if(col.clave==='id') return;
    if(hoja==='Vehiculos' && (col.clave==='ruedas' || col.clave==='ejes')) return;   /* ya se eligieron arriba */
    f.appendChild(campoDe(col, obj[col.clave], function(v){ obj[col.clave]=v; }));
  });
  cuerpo.appendChild(f);

  var bots = [];
  if(!nuevo && puede(S.vista,'borrar')) bots.push(el('button',{cls:'btn', onclick:function(){
    if(!confirm('¿Borrar este registro de la hoja '+hoja+'?')) return;
    borrarFila(hoja, obj); guardar([hoja]); cerrarModal();
  }},'Borrar'));
  bots.push(el('button',{cls:'btn pri', onclick:function(){
    guardarFila(hoja, obj); guardar([hoja], function(){ alTerminar && alTerminar(obj); }); cerrarModal();
  }},'Guardar'));
  modal((nuevo?'Nuevo registro · ':'Editar · ')+hoja, cuerpo, bots);
}

/* ------------------------------ FICHA O.T. --------------------------- */
function totalesOT(numero){
  var mo = T('OT_ManoObra').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  var ma = T('OT_Materiales').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  var te = T('OT_Terceros').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  return { mo:mo, ma:ma, te:te, total:mo+ma+te };
}

  var t = totalesOT(o.numero);
  var cuerpo = el('div');
  var v = unidad(o.interno) || {};

    '<div class="kpi"><div class="et">Unidad</div><div class="nu" style="font-size:19px">'+esc(o.interno)+'</div><div class="pie">'+esc((v.marca||'')+' '+(v.modelo||''))+' · '+esc(o.patente||v.patente||'')+'</div></div>'+
    '<div class="kpi"><div class="et">Estado</div><div class="nu" style="font-size:19px">'+esc(o.estado)+'</div><div class="pie">'+esc(o.clase)+' · '+esc(o.taller||'')+'</div></div>'+
    '<div class="kpi"><div class="et">Costo</div><div class="nu" style="font-size:19px">'+pesos(t.total)+'</div><div class="pie">MO '+pesos(t.mo)+' · Mat '+pesos(t.ma)+' · 3ros '+pesos(t.te)+'</div></div>'));

  var d = el('div',{cls:'card', style:'box-shadow:none;padding:0;margin-bottom:14px'});
  d.innerHTML = '<table><tbody>'+
    fila2('Apertura', fecha(o.fecha_apertura)+(o.fecha_cierre?' · cierre '+fecha(o.fecha_cierre):' · abierta hace '+dias(o.fecha_apertura)+' días'))+
    fila2('Odómetro', miles(o.odometro)+' km')+

    fila2('Diagnóstico', esc(o.diagnostico||'—'))+

  /* Una O.T. cerrada o anulada queda CON CANDADO: se mira, no se toca.

    h.appendChild(el('b',null, esc(titulo)));

    c.appendChild(h);

  };
  cuerpo.appendChild(seccion('Tareas','OT_Tareas',

    function(){ return { ot:o.numero, item:T('OT_Tareas').filter(function(x){return x.ot===o.numero;}).length+1, estado:'Pendiente' }; }));
  cuerpo.appendChild(seccion('Mano de obra','OT_ManoObra',
    [['fecha','Fecha','fecha'],['nombre','Quién'],['hora_inicio','Entrada'],['hora_fin','Salida'],['horas','Horas','n'],['costo_hora','$/hora','$'],['importe','Importe','$']],
    function(){ return { ot:o.numero, fecha:hoy() }; }));
  cuerpo.appendChild(seccion('Repuestos','OT_Materiales',
    [['articulo','Artículo','b'],['descripcion','Descripción'],['cantidad','Cantidad','n'],['costo_unit','Costo','$'],['importe','Importe','$'],['vale','Vale']],
    function(){ return { ot:o.numero, base:o.base, empresa_stock:o.empresa, prestamo:'No' }; }));
  cuerpo.appendChild(seccion('Terceros','OT_Terceros',
    [['proveedor','Proveedor','b'],['descripcion','Trabajo'],['comprobante','Comprobante'],['importe','Importe','$']],
    function(){ return { ot:o.numero, fecha:hoy(), moneda:'ARS' }; }));

  var bots = [];

    bots.push(el('button',{cls:'btn', onclick:function(){ recalcularOT(o.numero, false); }},'Recalcular costos'));
    bots.push(el('button',{cls:'btn pri', onclick:function(){ recalcularOT(o.numero, true); }},'✔ Cerrar O.T.'));
  }
  modal('O.T. '+o.numero, cuerpo, bots, 'ancho');

function fila2(a,b){ return '<tr><td style="width:190px;color:var(--t3)">'+esc(a)+'</td><td><b>'+b+'</b></td></tr>'; }
function otPorNumero(n){ var r=null; T('OT').forEach(function(o){ if(o.numero===n) r=o; }); return r; }

function recalcularOT(numero, cerrar){
  var o = otPorNumero(numero); if(!o) return;
  var t = totalesOT(numero);
  o.costo_mo = t.mo; o.costo_materiales = t.ma; o.costo_terceros = t.te; o.costo_total = t.total;
  if(cerrar && o.estado!=='Cerrada'){
    var pend = T('OT_Tareas').filter(function(x){ return x.ot===numero && !/hecha|cancelad/i.test(String(x.estado||'')); });
    var avisos = [];
    if(pend.length) avisos.push('· Tiene '+pend.length+' tarea(s) sin marcar como hecha.');
    if(!t.mo) avisos.push('· No tiene horas de mano de obra cargadas (sin horas el costo por km miente).');
    if(!String(o.trabajo||'').trim()) avisos.push('· No dice qué trabajo se hizo (campo "Trabajo realizado").');
    if(avisos.length && !confirm('Antes de cerrar la O.T. '+numero+':\n\n'+avisos.join('\n')+'\n\n¿La cerramos igual?')) return;
    if(!avisos.length && !confirm('¿Cerrar la O.T. '+numero+'? Después queda con candado: se puede mirar pero no cargar.')) return;
    o.estado = 'Cerrada'; o.fecha_cierre = hoy(); o.cerrada_por = S.usuario? S.usuario.nombre : '';
    if(!o.fecha_fin) o.fecha_fin = hoy();
    var v = unidad(o.interno); if(v && v.estado==='En taller'){ v.estado='Operativa'; guardarFila('Vehiculos', v); }
  }
  guardarFila('OT', o);
  guardar(['OT','Vehiculos'], function(){ aviso(cerrar && o.estado==='Cerrada' ? 'O.T. '+numero+' cerrada' : 'Costos recalculados'); fichaOT(otPorNumero(numero)); });
}
function cambiarEstadoOT(numero, estado){
  var o = otPorNumero(numero); if(!o) return;
  o.estado = estado;
  if(estado==='En ejecución' && !o.fecha_inicio) o.fecha_inicio = hoy();
  var v = unidad(o.interno); if(v && estado==='En ejecución' && v.estado!=='En taller'){ v.estado='En taller'; guardarFila('Vehiculos', v); }
  guardarFila('OT', o);
  guardar(['OT','Vehiculos'], function(){ aviso('O.T. '+numero+' → '+estado); fichaOT(otPorNumero(numero)); });
}
function reabrirOT(numero){
  var o = otPorNumero(numero); if(!o) return;
  if(!confirm('¿Reabrir la O.T. '+numero+'? Vuelve a estado "En ejecución" y se le va a poder cargar de nuevo.\n\nQueda anotado quién la reabrió.')) return;
  o.estado = 'En ejecución'; o.fecha_cierre = ''; o.cerrada_por = '';
  o.obs = (o.obs? o.obs+' · ' : '') + 'Reabierta el '+fecha(hoy())+' por '+(S.usuario? S.usuario.nombre : '');
  guardarFila('OT', o);
  guardar(['OT'], function(){ aviso('O.T. '+numero+' reabierta'); fichaOT(otPorNumero(numero)); });
}

function fichaUnidad(interno){
  var v = unidad(interno); if(!v) return;
  var km = kmActual(interno), ps = proximoServicio(v);
  var lec = lecturasDe(interno).filter(function(x){ return x.f!=='9999-12-31'; });
  var kmVida = lec.length>1 ? (lec[lec.length-1].km - lec[0].km) : 0;
  var ots = T('OT').filter(function(o){ return String(o.interno)===String(interno); });
  var comb = T('Combustible').filter(function(c){ return internoDe(c)===String(interno); });

function normTexto(s){
  return String(s===undefined||s===null?'':s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}

/* clave natural de cada hoja, para no duplicar al reimportar */
var CLAVE_HOJA = { Vehiculos:'vehiculo', Conductores:'dni', Personal:'legajo', Articulos:'codigo',
  Proveedores:'codigo', Empresas:'codigo', Bases:'codigo', OT:'numero', Neumaticos:'fuego' };

function separadorDe(linea){
  var c = { ';':0, ',':0, '\t':0, '|':0 };
  for(var i=0;i<linea.length;i++) if(c[linea[i]]!==undefined) c[linea[i]]++;
  var mejor=';', max=-1;
  Object.keys(c).forEach(function(k){ if(c[k]>max){ max=c[k]; mejor=k; } });
  return max>0 ? mejor : ';';
}
function parseCSV(texto){
  texto = texto.replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var lineas = texto.split('\n').filter(function(l){ return l.trim()!==''; });
  if(!lineas.length) return [];
  var sep = separadorDe(lineas[0]);
  return lineas.map(function(l){
    var out=[], act='', comillas=false;
    for(var i=0;i<l.length;i++){
      var ch=l[i];
      if(ch==='"'){ if(comillas && l[i+1]==='"'){ act+='"'; i++; } else comillas=!comillas; }
      else if(ch===sep && !comillas){ out.push(act.trim()); act=''; }
      else act+=ch;
    }
    out.push(act.trim());
    return out;
  });
}
function leerArchivo(file, cb, cbErr){
  var nombre = (file.name||'').toLowerCase();
  var r = new FileReader();
  if(/\.(xlsx|xlsm|xls)$/.test(nombre)){
    if(typeof XLSX === 'undefined') return cbErr('Para leer Excel hace falta internet la primera vez. Guardalo como CSV y probá de nuevo.');
    r.onload = function(e){
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        var hoja = wb.Sheets[wb.SheetNames[0]];
        var filas = XLSX.utils.sheet_to_json(hoja, {header:1, raw:false, defval:''});
        cb(filas.filter(function(f){ return f.some(function(c){ return String(c).trim()!==''; }); }));
      }catch(err){ cbErr('No se pudo leer el Excel: '+err.message); }
    };
    r.readAsArrayBuffer(file);
  } else {
    r.onload = function(e){
      var txt = e.target.result;
      /* los reportes viejos vienen en Latin-1 y rompen los acentos */
      if(/Ã|Â/.test(txt)){ try{ txt = new TextDecoder('windows-1252').decode(new TextEncoder().encode(txt)); }catch(x){} }
      cb(parseCSV(txt));
    };
    r.readAsText(file, 'utf-8');
  }
}

function mapearEncabezados(hoja, encabezados){
  var cols = ((S.esq||{})[hoja]||{cols:[]}).cols;
  var alias = ALIAS[hoja] || {};
  var mapa = [];
  encabezados.forEach(function(h){
    var n = normTexto(h), elegida = '';
    cols.forEach(function(c){
      if(elegida) return;
      if(n === normTexto(c.clave) || n === normTexto(c.titulo)) elegida = c.clave;
    });
    if(!elegida) Object.keys(alias).forEach(function(k){
      if(elegida) return;
      if(alias[k].some(function(a){ return normTexto(a) === n; })) elegida = k;
    });
    if(!elegida) cols.forEach(function(c){
      if(elegida) return;
      var t = normTexto(c.titulo);
      if(n && (t.indexOf(n)===0 || n.indexOf(t)===0)) elegida = c.clave;
    });
    mapa.push({ origen:h, destino:elegida });
  });
  return mapa;
}

    }
    /* mapeo */
    var m = el('div',{cls:'mapeo'});
    m.innerHTML = '<b style="color:var(--t2)">Columnas reconocidas:</b><br>';
    estado.mapa.forEach(function(x, i){
      var c = cols.filter(function(c){ return c.clave===x.destino; })[0];
      var sp = el('span', x.destino?{}:{cls:'no'});
      sp.innerHTML = esc(x.origen||'(sin título)') + ' → ' + (c ? esc(c.titulo) : 'se ignora');
      sp.style.cursor='pointer';
      sp.addEventListener('click', function(){
        var opts = cols.map(function(c){ return c.clave; });
        var elegido = prompt('¿A qué columna va "'+x.origen+'"?\n\n'+opts.join(', ')+'\n\n(vacío = ignorar)', x.destino||'');
        if(elegido!==null){ estado.mapa[i].destino = elegido.trim(); recalcular(); }
      });
      m.appendChild(sp);
    });
    cuerpo.appendChild(m);

    estado.avisos.forEach(function(a){ cuerpo.appendChild(el('div',{cls:a.nivel==='mal'?'err':'aviso'}, a.txt)); });

    if(estado.corregirKm){
      cuerpo.appendChild(el('button',{cls:'btn chico', style:'margin-bottom:10px', onclick:function(){
        estado.listas.forEach(function(r){ if(r._kmChico) { r[r._kmCampo] = num(r[r._kmCampo])*1000; r._kmChico=false; } });
        recalcular(true); }},'Corregir los kilómetros (×1000)'));
    }

    var op = el('div',{style:'display:flex;gap:14px;align-items:center;margin:10px 0;flex-wrap:wrap'});
    if(clave){
      var chk = el('input',{type:'checkbox', style:'width:auto'}); chk.checked = estado.actualizar;
      chk.addEventListener('change', function(e){ estado.actualizar=e.target.checked; recalcular(); });
      var lab = el('label',{style:'display:flex;gap:7px;align-items:center;text-transform:none;font-size:12.5px;color:var(--t2)'});
      lab.appendChild(chk); lab.appendChild(document.createTextNode('Actualizar los que ya existen (por '+clave+') en vez de duplicarlos'));
      op.appendChild(lab);
    }
    cuerpo.appendChild(op);

    var nuevos = estado.listas.filter(function(r){ return !r._existe; }).length;
    var actual = estado.listas.length - nuevos;
    cuerpo.appendChild(el('div',{cls:'mini',style:'margin-bottom:8px'},
      '<b style="color:var(--t1)">'+estado.listas.length+' filas leídas</b> · '+nuevos+' nuevas'+(clave?' · '+actual+' ya existen':'')));

    var usadas = estado.mapa.filter(function(x){ return x.destino; }).map(function(x){ return x.destino; });

      return [k, c?c.titulo:k, (c&&c.fmt!=='t')?'n':'t'];
    })));

  var recalcular = function(sinRevalidar){
    var enc = estado.filas[0];
    if(!sinRevalidar) estado.mapa = estado.mapa || mapearEncabezados(hoja, enc);
    var listas = [], avisos = [], corregir = false;
    var existentes = {};
    if(clave) T(hoja).forEach(function(r){ existentes[normTexto(r[clave])] = r; });

    for(var i=1;i<estado.filas.length;i++){
      var f = estado.filas[i], o = {};
      estado.mapa.forEach(function(x, k){
        if(!x.destino) return;
        var c = cols.filter(function(c){ return c.clave===x.destino; })[0];
        var v = f[k];
        o[x.destino] = (c && c.fmt!=='t') ? num(v) : String(v===undefined?'':v).trim();
      });
      if(!Object.keys(o).length) continue;
      if(!Object.keys(o).some(function(k){ return String(o[k]).trim()!==''; })) continue;
      /* si la hoja apunta por vehiculo_id, lo resolvemos desde la patente o el interno */
      if(cols.some(function(c){ return c.clave==='vehiculo_id'; })){
        var vv = unidadDe({ patente:o.Patente||o.patente||o.dominio, interno:o.Unidad||o.interno, vehiculo_id:o.vehiculo_id });
        if(vv){ o.vehiculo_id = vv.id; if(cols.some(function(c){ return c.clave==='Unidad'; })) o.Unidad = vv.vehiculo;
                if(cols.some(function(c){ return c.clave==='Patente'; })) o.Patente = vv.patente;
                if(!o.empresa_id && cols.some(function(c){ return c.clave==='empresa_id'; })) o.empresa_id = vv.empresa_id; }
        else if(o.Patente||o.patente) avisos.push({nivel:'al', txt:'La fila '+(i+1)+' trae la patente '+esc(o.Patente||o.patente)+' y esa unidad no está dada de alta. Se carga igual, pero conviene crearla en Vehículos.'});
      }
      if(cols.some(function(c){ return c.clave==='conductor_id'; }) && (o.DNI || o.dni)){
        var cc = IX.condDni[String(o.DNI||o.dni)];
        if(cc){ o.conductor_id = cc.id; if(cols.some(function(x){ return x.clave==='Conductor'; })) o.Conductor = cc.nombre; }
      }
      if(clave && o[clave]!==undefined){
        var ya = existentes[normTexto(o[clave])];
        if(ya){ o._existe = true; o.id = ya.id; }
      }
      /* control de odómetro: el clásico 446.000 que entra como 446 */
      ['odometro','km','km_carga','kmFinal','kmsFinales','kmManual'].forEach(function(campo){
        if(o[campo]===undefined || !num(o[campo])) return;
        var interno = o.vehiculo || o.interno || (o.patente ? String((IX.vehPat[normTexto(o.patente)]||{}).vehiculo||'') : '');
        var kmv = interno ? kmActual(interno) : 0;
        if(kmv && num(o[campo]) * 500 < kmv){ o._kmChico = true; o._kmCampo = campo; corregir = true; }
        if(kmv && num(o[campo]) > kmv * 50) avisos.push({nivel:'al', txt:'La fila '+(i+1)+' trae un kilometraje enorme ('+miles(o[campo])+'). Revisá que la columna no esté corrida.'});
      });
      listas.push(o);
    }
    if(corregir) avisos.unshift({ nivel:'mal', txt:'Hay kilometrajes que dan mil veces más chicos que el odómetro de la unidad. Suele ser el punto de miles leído como decimal ("446.000" entrando como 446). Corregilos antes de importar.' });
    if(!estado.mapa.some(function(x){ return x.destino; })) avisos.push({nivel:'mal', txt:'No reconocí ninguna columna. Hacé clic en un título para asignarlo a mano.'});
    estado.listas = listas; estado.avisos = avisos; estado.corregirKm = corregir;
    dibujar();
  };

  var cargar = function(file){
    leerArchivo(file, function(filas){
      if(filas.length<2){ alert('El archivo no tiene filas debajo del encabezado.'); return; }
      estado.filas = filas; estado.mapa = mapearEncabezados(hoja, filas[0]);
      recalcular(true);
    }, function(err){ alert(err); });
  };

  dibujar();
  var confirmar = el('button',{cls:'btn pri', onclick:function(){
    if(!estado.listas || !estado.listas.length){ alert('Todavía no cargaste el archivo.'); return; }

    var n = 0;
    estado.listas.forEach(function(r){
      var o = {};
      Object.keys(r).forEach(function(k){ if(k.indexOf('_')!==0) o[k]=r[k]; });

        var ya = (T(hoja).filter(function(x){ return String(x.id)===String(r.id); })[0]) || {};

      else { o.id = idNuevo(); if(opciones.base) Object.keys(opciones.base).forEach(function(k){ if(!o[k]) o[k]=opciones.base[k]; }); }
      guardarFila(hoja, o); n++;
    });
    guardar([hoja], function(){ alert('Se importaron '+n+' filas a '+hoja+'.'); });
    cerrarModal();
  }},'Importar');
  modal('Carga masiva · '+hoja, cuerpo, [confirmar], 'ancho');
}

function logoDe(codigo){ try{ return JSON.parse(localStorage.getItem('GF_LOGOS')||'{}')[codigo]||''; }catch(e){ return ''; } }
function guardarLogo(codigo, dato){
  var datos = {}; try{ datos = JSON.parse(localStorage.getItem('GF_LOGOS')||'{}'); }catch(x){}
  if(dato) datos[codigo] = dato; else delete datos[codigo];
  try{ localStorage.setItem('GF_LOGOS', JSON.stringify(datos)); }
  catch(x){ alert('El logo es muy pesado para el navegador. Probá con una imagen más chica.'); return false; }
  return true;
}
function borrarLogo(codigo){ guardarLogo(codigo, ''); pintar(); }
function subirLogo(codigo, cb){
  var inp = el('input',{type:'file', accept:'image/*', style:'display:none'});
  inp.addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onerror = function(){ alert('No se pudo leer el archivo.'); };
    r.onload = function(ev){
      var img = new Image();
      /* un SVG sin medidas propias da ancho 0: ahí guardamos el archivo tal cual */
      img.onerror = function(){ if(guardarLogo(codigo, ev.target.result)){ cb && cb(); pintar(); } };
      img.onload = function(){
        var an = img.naturalWidth || img.width, al = img.naturalHeight || img.height;
        if(!an || !al){ if(guardarLogo(codigo, ev.target.result)){ cb && cb(); pintar(); } return; }
        var c = document.createElement('canvas');
        var esc2 = Math.min(1, 320/an);
        c.width = Math.round(an*esc2); c.height = Math.round(al*esc2);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        if(guardarLogo(codigo, c.toDataURL('image/png'))){ cb && cb(); pintar(); }
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
}

/* ---------------------- foto de la pantalla de entrada ---------------- */
function subirFondo(){
  var inp = el('input',{type:'file', accept:'image/*', style:'display:none'});
  inp.addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onerror = function(){ alert('No se pudo leer el archivo.'); };
    r.onload = function(ev){
      var img = new Image();
      img.onerror = function(){ alert('Ese archivo no es una imagen que el navegador pueda mostrar.'); };
      img.onload = function(){
        var an = img.naturalWidth || img.width, al = img.naturalHeight || img.height;
        var c = document.createElement('canvas');
        var esc2 = Math.min(1, 1600/an);
        c.width = Math.round(an*esc2); c.height = Math.round(al*esc2);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var dato = c.toDataURL('image/jpeg', 0.82);
        try{ localStorage.setItem('GF_PORTADA_FONDO', dato); pintar(); }
        catch(x){ alert('La foto es muy pesada para el navegador. Probá con una más chica.'); }
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
}

/* ============================== ARRANQUE ============================== */
function arrancar(){
  var c = localStorage.getItem(LS.cache);
  if(c){ try{ var j=JSON.parse(c); S.db=j.db||{}; S.version=j.version||1; S.planilla=j.planilla||''; }catch(e){} }
  S.empresa = localStorage.getItem(LS.emp) || '*';
  S.periodo = localStorage.getItem('GF_PERIODO') || '3';
  try{ var vq = new URLSearchParams(location.search).get('v'); if(vq && RUTAS[vq]) S.vista = vq; }catch(e){}
  indexar();
  pintar();
  if(S.api){
    traer(function(){
      var u = localStorage.getItem(LS.ses);
      if(u) T('Usuarios').forEach(function(x){ if(x.usuario===u && x.activo!=='No') S.usuario=x; });
      pintar();
    });
    pedirEsquema();
  }
}
arrancar();
