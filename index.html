<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Flota</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --acento:#2b3440;
  --acento-suave:#f6eaec;
  --acento-borde:#e6ccd1;
  --fondo:#f4f5f7;
  --tarjeta:#ffffff;
  --t1:#1f2328;
  --t2:#4a5057;
  --t3:#8a9099;
  --linea:#e7e9ec;
  --ok:#1e7a52; --ok-bg:#e9f4ee;
  --alerta:#8a5b00; --alerta-bg:#fbf2e0;
  --mal:#9b2c2c; --mal-bg:#fbecec;
  --info:#1a4f8a; --info-bg:#e9f0f8;
  --sombra:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.05);
  --marca-txt:20px;   /* tamaño del nombre del sistema */
  --marca-logo:46px;  /* alto del logo o del cuadrado con las iniciales */
  --alto-top:74px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--t1);font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--t1)}
a{color:var(--acento);text-decoration:none}
.filo{height:3px;background:var(--acento)}
header.top{background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:40}
.top-in{max-width:none;margin:0;padding:12px 22px 12px 14px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:12px;width:248px;flex:none;padding-left:8px}
.marca .iso{width:var(--marca-logo);height:var(--marca-logo);border-radius:calc(var(--marca-logo)/4);background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--marca-logo)*.4);flex:none}
.marca b{display:block;font-size:var(--marca-txt);font-weight:700;letter-spacing:-.2px;line-height:1.15}
.marca span{display:block;font-size:calc(var(--marca-txt)*.58);color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-top:1px}
.top-sp{flex:1}
.top-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.layout{display:flex;align-items:flex-start}
aside.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--linea);min-height:calc(100vh - var(--alto-top));position:sticky;top:var(--alto-top);padding:14px 10px 40px;overflow:auto;max-height:calc(100vh - var(--alto-top))}
.side .sec{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);font-weight:700;padding:16px 12px 6px}
.side .grupo{font-size:13.5px;font-weight:700;color:var(--t1);padding:12px 12px 5px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--t2);cursor:pointer;font-size:13px;line-height:1.25}
.side a:hover{background:#f5f6f8;color:var(--t1)}
.side a.on{background:var(--acento-suave);color:var(--acento);font-weight:600}
.side a.on .ico{stroke:var(--acento)}
.side a .ico{stroke:var(--t3);flex:none}
.side a.falta{color:var(--t3)}
.side a .pend{margin-left:auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;background:#f0f1f3;color:var(--t3);border-radius:5px;padding:1px 5px}
main{flex:1;min-width:0;max-width:1240px;padding:20px 22px 70px}
/* el módulo de almacén/compras se monta acá adentro, a pantalla completa */
main.modulo{max-width:none;padding:0}
.modmarco{height:calc(100vh - var(--alto-top));width:100%}
.modmarco.chico{height:calc(100vh - var(--alto-top) - 150px);min-height:560px;border:1px solid var(--linea);border-radius:12px;overflow:hidden;background:#fff}
.modframe{width:100%;height:100%;border:0;display:block;background:#fff}
@media(max-width:900px){.layout{display:block}aside.side{width:auto;position:static;max-height:none;min-height:0;border-right:0;border-bottom:1px solid var(--linea);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
 .side .sec,.side .grupo{width:100%;padding:8px 10px 2px}.side a{padding:7px 10px}}
.h1{font-size:20px;font-weight:700;margin:0 0 2px}
.sub{color:var(--t3);margin:0 0 18px;font-size:12.5px}
.card{background:var(--tarjeta);border-radius:12px;box-shadow:var(--sombra);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:14px 16px}
.kpi .et{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);font-weight:600}
.kpi .nu{font-size:26px;font-weight:700;margin-top:5px;letter-spacing:-.5px}
.kpi .pie{font-size:11.5px;color:var(--t3);margin-top:3px}
.kpi.aviso .nu{color:var(--mal)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f2f4;color:var(--t2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td b{color:var(--t1);font-weight:600}
.tabla-wrap{overflow-x:auto;margin:0 -6px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#f0f1f3;color:var(--t2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.al{background:var(--alerta-bg);color:var(--alerta)}
.chip.ma{background:var(--mal-bg);color:var(--mal)}
.chip.in{background:var(--info-bg);color:var(--info)}
.chip.ac{background:var(--acento-suave);color:var(--acento)}
.acc{display:flex;gap:5px;justify-content:flex-end}
.acc button{border:1px solid var(--linea);background:#fff;border-radius:8px;width:30px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);padding:0}
.acc button:hover{border-color:#d5d8dd;color:var(--t1);background:#fafbfc}
.acc button.ed:hover{border-color:var(--ok);color:var(--ok)}
.acc button.bo:hover{border-color:var(--mal);color:var(--mal)}
.acc button .ico{width:15px;height:15px}
.btn{border:1px solid var(--linea);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--t2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d5d8dd;color:var(--t1)}
.btn.pri{background:var(--acento);border-color:var(--acento);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.chico{padding:4px 9px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
textarea{min-height:64px;resize:vertical}
.campo{margin-bottom:11px}
.fila{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.42);display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;z-index:80;overflow:auto}
.modal{background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(16,24,40,.22);width:100%;max-width:860px}
.modal.ancho{max-width:1080px}
.modal.angosto{max-width:440px}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px}
.modal-h b{font-size:15px}
.modal-b{padding:18px 20px;max-height:70vh;overflow:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--linea);display:flex;gap:9px;justify-content:flex-end;background:#fbfbfc;border-radius:0 0 14px 14px}
.vacio{text-align:center;padding:34px 18px;color:var(--t3)}
.vacio b{display:block;color:var(--t2);margin-bottom:5px;font-size:14px}
.est{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3)}
.ver{font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--acento);background:var(--acento-suave);border:1px solid var(--acento-borde);border-radius:999px;padding:3px 9px;white-space:nowrap;cursor:help}
.pt{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.pt.v{background:var(--ok)} .pt.r{background:var(--mal)} .pt.a{background:var(--alerta)}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--linea);margin:-4px 0 14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 13px;cursor:pointer;color:var(--t3);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acento);border-bottom-color:var(--acento)}
.barra{height:6px;background:#eef0f2;border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--acento)}
.mini{font-size:11.5px;color:var(--t3)}
/* pantalla de entrada: texto a la izquierda, foto a la derecha, el cuadro montado en el medio */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:55% 45%;position:relative;background:#f7f8fa;overflow:hidden}
.portada-izq{display:flex;flex-direction:column;justify-content:center;padding:60px 42% 60px 7%}
.portada-izq h2{font-size:clamp(34px,5.2vw,64px);font-weight:300;line-height:1.05;margin:0 0 22px;color:#1f2328;letter-spacing:-.5px}
.portada-izq .raya{width:150px;height:2px;background:var(--acento);margin:0 0 26px}
.portada-izq p{color:#5c6470;font-size:15px;line-height:1.5;margin:0;max-width:520px}
.portada-der{background:linear-gradient(135deg,#1c2430 0%,#2b3440 45%,#4a5668 100%);background-size:cover;background-position:center}
.login{position:absolute;left:41%;top:50%;transform:translateY(-50%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(16,24,40,.22);padding:34px 36px;width:100%;max-width:440px;text-align:center;z-index:2}
@media(max-width:900px){
  /* celular: la MISMA composición que en la computadora, solo más chica */
  .login-wrap{grid-template-columns:50% 50%}
  .portada-izq{padding:40px 6% 24px 5%;justify-content:flex-start}
  .portada-izq h2{font-size:26px;margin-bottom:12px}
  .portada-izq .raya{width:70px;margin-bottom:12px}
  .portada-izq p{font-size:12px}
  .login{left:50%;top:56%;transform:translate(-50%,-50%);width:calc(100% - 28px);max-width:360px;padding:22px 18px}
  .login h1{font-size:16px}
}
.login .iso{width:52px;height:52px;border-radius:14px;background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;margin:0 auto 12px}
.login h1{font-size:19px;margin:0 0 3px}
.login p{color:var(--t3);margin:0 0 20px;font-size:12.5px}
.pin{letter-spacing:8px;text-align:center;font-size:19px}
.pin.codigo{letter-spacing:4px;font-size:17px}
.emp-entrada{background:var(--acento-suave);border:1px solid var(--acento-borde);border-radius:10px;padding:8px 12px;font-size:12.5px;margin:-8px 0 14px}
.emp-entrada a{color:var(--acento);cursor:pointer;text-decoration:underline}
.emp-fija{font-size:12.5px;font-weight:600;padding:6px 12px;border:1px solid var(--acento-borde);background:var(--acento-suave);border-radius:8px;white-space:nowrap}
.err{background:var(--mal-bg);color:var(--mal);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;font-weight:600}
.aviso{background:var(--alerta-bg);color:var(--alerta);padding:10px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.soltar{border:2px dashed var(--linea);border-radius:12px;padding:26px 18px;text-align:center;color:var(--t3);background:#fbfbfc;cursor:pointer}
.soltar:hover{border-color:var(--acento);color:var(--acento);background:var(--acento-suave)}
.soltar b{display:block;color:var(--t1);font-size:14px;margin-bottom:4px}
.mapeo{font-size:11.5px;color:var(--t3);margin-top:10px}
.mapeo span{display:inline-block;background:#f0f1f3;border-radius:6px;padding:2px 8px;margin:2px}
.mapeo span.no{background:var(--mal-bg);color:var(--mal)}
.logoemp{height:var(--marca-logo);max-width:calc(var(--marca-logo)*3.6);object-fit:contain;flex:none}
.lista-doc{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;cursor:pointer;background:#fff}
.doc:hover{border-color:#d5d8dd;background:#fafbfc}
.doc .cre{flex:1;min-width:0}
.doc .cre b{display:block;font-size:13px}
.doc .cre span{font-size:11.5px;color:var(--t3)}
@media(max-width:700px){.marca{width:auto;padding-left:0}.marca span{display:none}main{padding:14px 12px 60px}}
.aviso-candado{background:var(--alerta-bg);color:var(--alerta);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.avisito{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--t1,#1f2328);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9999;max-width:92vw;text-align:center}
.side a.afuera .pend{background:transparent;color:var(--t3,#8a9099);font-size:13px}
@media(max-width:700px){.top-in{flex-wrap:wrap;padding:10px 12px}.top-sp{display:none}.top-tools{width:100%;justify-content:flex-start}.top-tools select{min-width:0!important;flex:1 1 140px}}
</style>
</head>

<div id="app"></div>
<script>
/* =====================================================================
   GESTIÓN DE FLOTA · app web · v1.0
   Un solo archivo, sin librerías. Habla con la planilla "Gestión de Flota"
   a través de gestion-de-flota.gs (menú → Implementar → Aplicación web).
   ===================================================================== */

/* La dirección del script de tu planilla. Ya viene puesta: la app arranca sola,
   sin pedirte que la pegues. Si algún día cambia, se edita acá o desde
   Configuración → Mi empresa → Conexión. */
var API_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbxZ7-_1MOP785xB5UUlNQ_8tKFubTW8c_0IWrPoJct-NiZzeEp1ik3NHdKa-7bqdS_H/exec';
var LS = { api:'GF_API', cache:'GF_CACHE', ses:'GF_SESION', acento:'GF_ACENTO', emp:'GF_EMPRESA', tok:'GF_TOKEN',
           clave:'GF_CLAVE_EMP', empFija:'GF_EMPRESA_FIJA' };

/* --------------------------- estado global --------------------------- */
var S = {
  api: localStorage.getItem(LS.api) || API_URL_DEFAULT,
  db: {}, version: 0, planilla: '', conectado: false, cargando: false,
  usuario: null, empresa: '', vista: 'panel', sub: '', error: '', ultimo: '',
  periodo: '3', buscar: '', filtroEstado: '',
  sucio: {}, guardando: false, modal: null,
  token: localStorage.getItem('GF_TOKEN') || '', permServidor: null,
  /* código de acceso por empresa: exigeClave lo dice el conector; clave es la
     que ya validó; empresaEntrada es la empresa a la que pertenece esa clave */
  exigeClave: false, clave: localStorage.getItem('GF_CLAVE_EMP') || '', empresaEntrada: null,
  empresaFija: localStorage.getItem('GF_EMPRESA_FIJA') || '',
  /* código de acceso de Mi empresa: lo dice el conector al leer; cfgOk es si esta sesión ya lo escribió bien */
  claveConfigServidor: null, cfgOk: false
};

/* ------------------------------ utilidades --------------------------- */
function $(s,c){ return (c||document).querySelector(s); }
function el(t,p,h){ var e=document.createElement(t); if(p) for(var k in p){ if(k==='cls') e.className=p[k]; else if(k.indexOf('on')===0) e.addEventListener(k.substring(2),p[k]); else if(p[k]!==null&&p[k]!==undefined) e.setAttribute(k,p[k]); } if(h!==undefined&&h!==null) e.innerHTML=h; return e; }
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(v){ if(typeof v==='number') return v; if(v===''||v===null||v===undefined) return 0;
  var s=String(v).trim().replace(/[^0-9,.\-]/g,''); var p=s.indexOf('.')>=0, c=s.indexOf(',')>=0;
  if(p&&c) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(c) s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,'') : s.replace(',','.');
  else if(p && /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');   /* 446.000 son 446 mil, no 446 */
  var n=parseFloat(s); return isNaN(n)?0:n; }
function pesos(v){ return '$' + num(v).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function miles(v){ return num(v).toLocaleString('es-AR',{maximumFractionDigits:0}); }
function hoy(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function fecha(f){ if(!f) return ''; var m=String(f).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : String(f); }
function dias(desde,hasta){ if(!desde) return 0; var a=new Date(desde+'T00:00:00'), b=hasta?new Date(hasta+'T00:00:00'):new Date();
  return Math.round((b-a)/86400000); }
function T(h){ return (S.db[h]||[]); }
/* avisito flotante (el del módulo de almacén vive adentro del iframe, este es el de la app) */
function aviso(m){ var d=document.createElement('div'); d.className='avisito'; d.textContent=m;
  document.body.appendChild(d); setTimeout(function(){ d.remove(); },2800); }
function idNuevo(){ return String(Date.now())+String(Math.floor(Math.random()*1000)); }
function ico(d){ return '<svg class="ico" viewBox="0 0 24 24">'+d+'</svg>'; }
var ICO = {
  panel:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
  bus:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M3 11h18M7 17v2M17 17v2"/><circle cx="7.5" cy="14.5" r="1"/><circle cx="16.5" cy="14.5" r="1"/>',
  llave:'<path d="M14.7 6.3a4 4 0 1 0 3 3L21 6l-2-2-3.3 2.3z"/><path d="M11.7 9.3 3 18l3 3 8.7-8.7"/>',
  caja:'<path d="M21 8v12H3V8M1 4h22v4H1zM10 12h4"/>',
  carro:'<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M1 2h3l2.6 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 7H6"/>',

/* ------------------------------- conexión ---------------------------- */
function apiGet(params, cb, cbErr){
  if(!S.api) return cbErr && cbErr('Falta la dirección del script.');
  var p2 = { gf: params.accion || 'leer' };
  Object.keys(params).forEach(function(k){ if(k!=='accion') p2[k]=params[k]; });
  if(S.token && !p2.token) p2.token = S.token;   /* el conector con permisos lo pide */
  var q = Object.keys(p2).map(function(k){ return k+'='+encodeURIComponent(p2[k]); }).join('&');
  fetch(S.api+'?'+q).then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.ok===false) return cbErr && cbErr(j.error||'La planilla devolvió un error.'); cb(j); })
    .catch(function(e){ cbErr && cbErr('No se pudo hablar con la planilla: '+e.message); });
}
function apiPost(cuerpo, cb, cbErr, intento){
  if(!S.api) return cbErr && cbErr('Falta la dirección del script.');
  cuerpo.gf = cuerpo.accion || 'guardarTodo';   /* rama del sistema nuevo en el conector unificado */
  if(S.token) cuerpo.token = S.token;
  intento = intento || 1;
  fetch(S.api, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo) })
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var j;
      try { j = JSON.parse(txt); }
      catch(e){
        /* Google devolvió una página (HTML) en vez de la respuesta: pasa cuando la planilla
           está ocupada o el script se cayó. Se reintenta solo, 3 veces, antes de avisar. */
        if(intento < 3){ setTimeout(function(){ apiPost(cuerpo, cb, cbErr, intento+1); }, 1500*intento); return; }
        var esHtml = /^\s*</.test(txt||'');
        return cbErr && cbErr(esHtml
          ? 'La planilla no respondió bien (Google devolvió una página de error 3 veces seguidas). Probá de nuevo en un minuto; si sigue, en Apps Script mirá "Ejecuciones" para ver el error.'
          : 'No se pudo guardar: '+e.message);
      }
      if(j && j.ok===false) return cbErr && cbErr(j.error||'No se pudo guardar.', j);
      cb(j);
    })
    .catch(function(e){
      if(intento < 3){ setTimeout(function(){ apiPost(cuerpo, cb, cbErr, intento+1); }, 1500*intento); return; }
      cbErr && cbErr('No se pudo guardar: '+e.message);
    });
}

/* El esquema (columnas de cada hoja) lo necesitan todos los formularios. Se pide al
   arrancar, pero si esa primera llamada falla (Apps Script arrancando en frío, red)
   se vuelve a pedir en cada Actualizar y en el momento de abrir un formulario. */
function pedirEsquema(cb){
  if(S.esqPidiendo) return;
  S.esqPidiendo = true;
  apiGet({accion:'esquema'}, function(j){
    S.esqPidiendo = false;
    if(j && j.esquema){ S.esq=j.esquema; S.listas=j.listas||S.listas; pintar(); cb && cb(true); }
    else cb && cb(false);
  }, function(err){ S.esqPidiendo = false; cb && cb(false, err); });
}

function traer(cb){
  S.cargando = true; S.error=''; pintar();
  if(!S.esq) pedirEsquema();
  apiGet({ accion:'leer' }, function(j){
    S.db = j.datos || {}; S.version = Number(j.version_datos||1); S.planilla = j.planilla||'';
    if(j.permisos) S.permServidor = j.permisos;
    if(j.clave_config!==undefined) S.claveConfigServidor = !!j.clave_config;   /* false = el .gs tiene GF_CLAVE_MIEMPRESA vacío: no pide */
    S.conectado = true; S.cargando = false; S.ultimo = new Date().toLocaleTimeString('es-AR');
    try{ localStorage.setItem(LS.cache, JSON.stringify({db:S.db, version:S.version, planilla:S.planilla, cuando:Date.now()})); }catch(e){}
    if(!S.empresa){ var e0 = T('Empresas')[0]; S.empresa = localStorage.getItem(LS.emp) || (e0?e0.codigo:''); }
    indexar(); S.cargando=false; pintar(); cb && cb();
  }, function(err){
    S.cargando = false; S.error = err;
    if(/sesi[oó]n vencida/i.test(String(err))){    /* el token se venció: de vuelta al login */
      S.token=''; S.usuario=null; S.permServidor=null;
      localStorage.removeItem(LS.tok); localStorage.removeItem(LS.ses);
    }
    var c = localStorage.getItem(LS.cache);
    if(c && !Object.keys(S.db).length){ try{ var j2=JSON.parse(c); S.db=j2.db; S.version=j2.version; S.planilla=j2.planilla; }catch(e){} }
    /* con el candado puesto no se puede leer nada sin entrar: pido solo la lista
       de usuarios (sin PIN) para poder dibujar el desplegable del login */
    if(!S.usuario && !(T('Usuarios')||[]).length){
      pedirUsuarios(S.clave);
      return;
    }
    pintar();
  });
}

/* La lista para el desplegable del login. Si alguna empresa tiene código de
   acceso, el conector no la entrega hasta que se escriba el código correcto. */
function pedirUsuarios(clave, cb){
  var p = {accion:'usuarios'}; if(clave) p.clave = clave;
  apiGet(p, function(j){
    S.exigeClave = !!(j && j.exige_clave);
    S.error='';   /* el "sesión vencida" de recién era solo que todavía no entró */
    if(j && j.usuarios && j.usuarios.length){ S.db.Usuarios = j.usuarios; }
    if(S.exigeClave){
      if(j.empresa){ S.clave = clave; S.empresaEntrada = j.empresa; localStorage.setItem(LS.clave, clave); }
      else { S.clave=''; S.empresaEntrada=null; localStorage.removeItem(LS.clave); }
    }
    pintar(); cb && cb(true);
  }, function(err){
    if(/c[oó]digo de acceso/i.test(String(err))){ S.exigeClave = true; S.clave=''; S.empresaEntrada=null; localStorage.removeItem(LS.clave); S.error = err; }
    pintar(); cb && cb(false);
  });
}

/* con el conector viejo (sin gf=usuarios) la clave se controla acá, contra la

/* Guarda solo las hojas tocadas. Si otro guardó en el medio, avisa y no pisa. */
function guardar(hojas, cb){
  (hojas||[]).forEach(function(h){ S.sucio[h]=true; });
  var pend = Object.keys(S.sucio);
  if(!pend.length) return cb && cb();
  var datos = {}; pend.forEach(function(h){ datos[h] = S.db[h]||[]; });
  S.guardando = true; pintar();
  apiPost({ accion:'guardarTodo', version:S.version, usuario:(S.usuario?S.usuario.nombre:''), datos:datos },
    function(j){ S.version = Number(j.version_datos||S.version+1); S.sucio={}; S.guardando=false; S.ultimo=new Date().toLocaleTimeString('es-AR');
      try{ localStorage.setItem(LS.cache, JSON.stringify({db:S.db, version:S.version, planilla:S.planilla, cuando:Date.now()})); }catch(e){}
      pintar(); cb && cb(); },
    function(err, j){ S.guardando=false;
      if(j && j.conflicto) S.error='Alguien más guardó en la planilla mientras trabajabas. Apretá Actualizar y volvé a cargarlo.';
      else S.error = err;
      pintar(); });
}

/* =====================================================================
   CAPA DE DATOS
   La planilla usa TUS nombres: en Vehiculos el interno es la columna
   "vehiculo" y el odómetro es "km"; las hojas hijas apuntan con
   vehiculo_id y traen Unidad/Patente al final. Acá se resuelve todo eso
   una sola vez y el resto de la app trabaja con el interno.
   ===================================================================== */
var IX = { vehId:{}, vehInt:{}, vehPat:{}, empId:{}, empCod:{}, condId:{}, condDni:{}, persLeg:{} };
function indexar(){
  /* Filas pegadas a mano en la planilla vienen sin "id". Sin id, editar se tomaba
     como "registro nuevo" y duplicaba la fila. Acá se les da un id apenas llegan;
     queda escrito en la planilla la próxima vez que se guarda esa hoja. */
  Object.keys(S.db||{}).forEach(function(h){
    (S.db[h]||[]).forEach(function(r){ if(r && typeof r==='object' && !r.id) r.id = idNuevo(); });
  });
  IX = { vehId:{}, vehInt:{}, vehPat:{}, empId:{}, empCod:{}, condId:{}, condDni:{}, persLeg:{} };
  T('Vehiculos').forEach(function(v){
    if(v.id) IX.vehId[String(v.id)] = v;
    if(v.vehiculo) IX.vehInt[String(v.vehiculo).trim()] = v;
    if(v.patente) IX.vehPat[normTexto(v.patente)] = v;
  });
  T('Empresas').forEach(function(e){
    if(e.id) IX.empId[String(e.id)] = e;
    if(e.codigo) IX.empCod[String(e.codigo).trim().toUpperCase()] = e;
  });
  T('Conductores').forEach(function(c){ if(c.id) IX.condId[String(c.id)]=c; if(c.dni) IX.condDni[String(c.dni)]=c; });
  T('Personal').forEach(function(p){ if(p.legajo) IX.persLeg[String(p.legajo)]=p; });
}
function unidad(interno){ return IX.vehInt[String(interno||'').trim()] || null; }
/* de cualquier fila saca la unidad: por interno, por vehiculo_id o por patente */
function unidadDe(r){
  if(!r) return null;
  if(r.interno && IX.vehInt[String(r.interno).trim()]) return IX.vehInt[String(r.interno).trim()];
  if(r.Unidad && IX.vehInt[String(r.Unidad).trim()]) return IX.vehInt[String(r.Unidad).trim()];
  if(r.vehiculo_id && IX.vehId[String(r.vehiculo_id)]) return IX.vehId[String(r.vehiculo_id)];
  var pat = r.patente || r.dominio || r.Patente;
  if(pat && IX.vehPat[normTexto(pat)]) return IX.vehPat[normTexto(pat)];
  return null;
}
function internoDe(r){ var v = unidadDe(r); return v ? String(v.vehiculo) : String(r.interno || r.Unidad || ''); }
function empCod(r){
  if(!r) return '';
  if(r.empresa) return String(r.empresa).toUpperCase();
  if(r.empresa_id && IX.empId[String(r.empresa_id)]) return String(IX.empId[String(r.empresa_id)].codigo||'').toUpperCase();
  var v = unidadDe(r);
  if(v && v.empresa_id && IX.empId[String(v.empresa_id)]) return String(IX.empId[String(v.empresa_id)].codigo||'').toUpperCase();
  return '';
}
function empNombre(cod){ var e = IX.empCod[String(cod||'').toUpperCase()]; return e ? e.nombre : cod; }
function porEmpresa(filas){
  if(!S.empresa || S.empresa==='*') return filas;
  return filas.filter(function(f){ var c = empCod(f); return !c || c === S.empresa; });
}

/* ---------------------- kilómetros: una sola fuente ------------------ */
function lecturasDe(interno){
  var v = unidad(interno), l = [];
  T('Combustible').forEach(function(c){
    if(internoDe(c)!==String(interno)) return;
    if(num(c.km_carga)) l.push({ f:String(c.fecha), km:num(c.km_carga) });
  });
  T('Lecturas').forEach(function(c){ if(String(c.interno)===String(interno) && num(c.km)) l.push({f:String(c.fecha), km:num(c.km)}); });
  T('OT').forEach(function(c){ if(String(c.interno)===String(interno) && num(c.odometro)) l.push({f:String(c.fecha_apertura), km:num(c.odometro)}); });
  T('Partes').forEach(function(c){ if(internoDe(c)===String(interno) && num(c.kmFinal)) l.push({f:String(c.fecha), km:num(c.kmFinal)}); });
  T('Checks').forEach(function(c){ if(String(c.interno)===String(interno)){
    if(num(c.kmsFinales)) l.push({f:String(c.fecha), km:num(c.kmsFinales)});
    else if(num(c.kmsIniciales)) l.push({f:String(c.fecha), km:num(c.kmsIniciales)});
  }});
  if(v && num(v.km)) l.push({ f:'9999-12-31', km:num(v.km) });
  return l.sort(function(a,b){ return a.f<b.f?-1:1; });
}
function kmActual(interno){
  var k = 0;
  lecturasDe(interno).forEach(function(x){ k = Math.max(k, x.km); });
  return k;
}
function kmDelPeriodo(interno){
  var l = lecturasDe(interno).filter(function(x){ return x.f !== '9999-12-31'; });
  var d = desdePeriodo();
  var dentro = l.filter(function(x){ return x.f >= d; });
  if(!dentro.length) return 0;
  var antes = l.filter(function(x){ return x.f < d; });
  var base = antes.length ? antes[antes.length-1].km : dentro[0].km;
  return Math.max(0, dentro[dentro.length-1].km - base);
}
function consumoReal(interno){
  var cargas = [];
  T('Combustible').forEach(function(c){ if(internoDe(c)===String(interno) && num(c.litros) && num(c.km_carga)) cargas.push(c); });
  if(cargas.length<2) return 0;
  cargas.sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; });
  var km = num(cargas[cargas.length-1].km_carga) - num(cargas[0].km_carga);
  var litros = 0;
  for(var i=1;i<cargas.length;i++) litros += num(cargas[i].litros);
  return (km>0 && litros>0) ? (litros*100/km) : 0;
}

/* --------------- plan de mantenimiento (PlanMant + PlanUnidades) ----- */
function jsonSeguro(v){ if(!v) return []; if(typeof v==='object') return v; try{ var x=JSON.parse(v); return x&&x.length?x:[]; }catch(e){ return []; } }
function planDe(interno){
  var pu = null;
  T('PlanUnidades').forEach(function(p){ if(String(p.interno).trim()===String(interno).trim()) pu=p; });
  if(!pu) return null;
  var pm = null;
  T('PlanMant').forEach(function(p){ if(String(p.id)===String(pu.planId)) pm=p; });
  return { unidad:pu, plan:pm, servicios:jsonSeguro(pm&&pm.servicios), ultimos:jsonSeguro(pu.ultimos) };
}
function proximoServicio(v){
  var interno = v.vehiculo || v.interno;
  var p = planDe(interno);
  if(!p || !p.servicios.length) return null;
  var km = kmActual(interno), mejor = null;
  p.servicios.forEach(function(sv){
    var inter = num(sv.km || sv.intervalo);
    if(!inter) return;
    var ult = 0;
    p.ultimos.forEach(function(u){ if(String(u.codigo)===String(sv.codigo)) ult = Math.max(ult, num(u.km)); });
    var proximo = ult ? ult + inter : Math.ceil((km||1)/inter)*inter;
    var falta = proximo - km;
    if(!mejor || falta < mejor.falta) mejor = { falta:falta, codigo:sv.codigo, desc:sv.descripcion||'', proximo:proximo, tol:num(sv.tolerancia)||1000 };
  });
  return mejor;
}

/* -------------------------- pañol (hojas nuevas) --------------------- */
function stockMapa(){
  var m = {};
  T('Movimientos').forEach(function(v){
    if(!v.articulo) return;
    var k = v.empresa+'|'+v.base+'|'+v.articulo;
    if(!m[k]) m[k] = { empresa:v.empresa, base:v.base, articulo:v.articulo, cant:0, costo:0, ult:'' };
    m[k].cant += num(v.cantidad);
    if(num(v.costo_unit)) m[k].costo = num(v.costo_unit);
    if(v.fecha > m[k].ult) m[k].ult = v.fecha;
  });
  return m;
}
function stockLista(){
  var m = stockMapa(), art = {}, par = {};
  T('Articulos').forEach(function(a){ art[a.codigo]=a; });
  T('StockParam').forEach(function(p){ par[p.articulo+'|'+p.empresa+'|'+p.base]=p; });
  return Object.keys(m).map(function(k){
    var r = m[k], a = art[r.articulo]||{}, p = par[r.articulo+'|'+r.empresa+'|'+r.base]||{};
    r.desc = a.descripcion||''; r.um = a.um||''; r.criticidad = a.criticidad||'';
    r.minimo = num(p.minimo); r.maximo = num(p.maximo); r.ubicacion = p.ubicacion||'';
    r.valor = r.cant * (r.costo || num(a.costo_referencia));
    r.bajo = r.minimo>0 && r.cant < r.minimo;
    return r;
  }).sort(function(a,b){ return (a.ubicacion||'zzz').localeCompare(b.ubicacion||'zzz'); });
}
function desdePeriodo(){
  if(S.periodo==='todo') return '0000-00-00';
  var d = new Date();
  if(S.periodo==='mes') return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-01';
  d.setMonth(d.getMonth() - (S.periodo==='6' ? 5 : 2));
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-01';
}
function nombrePeriodo(){
  return S.periodo==='mes' ? 'este mes' : (S.periodo==='6' ? 'últimos 6 meses' : (S.periodo==='todo' ? 'todo el historial' : 'últimos 3 meses'));
}
function enPeriodo(f){ return String(f||'') >= desdePeriodo(); }

/* vencimientos: los de la hoja Documentacion y los que viven en Vehiculos */
function vencimientos(){
  var out = [], ya = {};
  T('Documentacion').forEach(function(d){
    if(!d.vencimiento) return;
    ya[normTexto(d.referencia)+'|'+normTexto(d.tipo)] = true;
    out.push({ ref:d.referencia, tipo:d.tipo, vence:String(d.vencimiento), origen:'Documentacion', fila:d });
  });
  T('Vehiculos').forEach(function(v){

function alertasDelDia(){
  var a = [];
  var diasAviso = 30;
  T('Parametros').forEach(function(c){ if(c.clave==='dias_aviso_vencimiento') diasAviso = num(c.valor)||30; });

  porEmpresa(T('OT')).forEach(function(o){
    if(o.estado==='Espera repuesto') a.push({n:'ma', t:'O.T. '+o.numero+' esperando repuesto', d:'Interno '+o.interno+' · '+dias(o.fecha_apertura)+' días abierta', ir:'ot'});
    if(o.estado==='Espera autorización') a.push({n:'ma', t:'O.T. '+o.numero+' esperando autorización', d:'Interno '+o.interno, ir:'ot'});
  });
  porEmpresa(T('Solicitudes')).forEach(function(x){
    if(x.estado==='Esperando autorización') a.push({n:'ma', t:'Solicitud '+x.numero+' sin autorizar',
      d:(num(x.horas_espera)?num(x.horas_espera)+' horas de espera · ':'')+pesos(x.monto_estimado)+(x.interno?' · interno '+x.interno:''), ir:'solicitudes'});
  });
  T('Ordenes').forEach(function(o){
    if((o.estado==='Emitida'||o.estado==='Recibida parcial') && o.entrega_comprometida && o.entrega_comprometida < hoy())
      a.push({n:'al', t:'Orden '+o.numero+' vencida', d:'Prometida para el '+fecha(o.entrega_comprometida)+' · '+o.proveedor, ir:'ordenes'});
  });
  vencimientos().forEach(function(v){
    if(v.origen==='Conductores') return;   /* las licencias las mira Tráfico */
    var dd = dias(hoy(), v.vence);
    if(isNaN(dd)) return;
    if(dd < 0) a.push({n:'ma', t:v.tipo+' VENCIDO', d:v.ref+' · venció el '+fecha(v.vence), ir:(v.origen==='Conductores'?'conductores':'vehiculos')});
    else if(dd <= diasAviso) a.push({n:'al', t:v.tipo+' vence en '+dd+' días', d:v.ref+' · '+fecha(v.vence), ir:(v.origen==='Conductores'?'conductores':'vehiculos')});
  });
  stockLista().forEach(function(x){
    if(x.bajo && (!S.empresa || S.empresa==='*' || x.empresa===S.empresa))
      a.push({n:'al', t:'Bajo mínimo: '+x.articulo, d:x.desc+' · quedan '+miles(x.cant)+' de un mínimo de '+miles(x.minimo)+' en '+x.base, ir:'stock'});
  });
  T('Traslados').forEach(function(t){
    if(t.estado==='En tránsito') a.push({n:'al', t:'Traslado '+t.numero+' en tránsito hace '+dias(t.fecha_despacho)+' días', d:t.base_origen+' → '+t.base_destino, ir:'traslados'});
  });
  T('Devoluciones').forEach(function(d){
    if(!/Nota de crédito|Repuesta|Cerrada/.test(String(d.estado)))
      a.push({n:'al', t:'Devolución '+d.numero+' abierta', d:d.proveedor+' · '+pesos(d.importe)+' · '+d.motivo, ir:'recepciones'});
  });
  T('PedidosInsumos').forEach(function(p){ if(!/entregado|cerrado/i.test(String(p.estado||''))) a.push({n:'al', t:'Pedido de insumos sin resolver', d:(p.conductor||'')+' · interno '+(p.interno||'')+' · '+fecha(p.fecha), ir:'appconductor'}); });
  T('Checks').forEach(function(c){ if(c.comentarios && !c.ot_id) a.push({n:'ma', t:'Novedad de conductor sin O.T.', d:'Interno '+c.interno+' · '+String(c.comentarios).substring(0,70), ir:'controldiario'}); });
  var orden = { ma:0, al:1, in:2 };
  return a.sort(function(x,y){ return orden[x.n]-orden[y.n]; });
}

/* ====================== PERMISOS POR USUARIO =========================
   Manda la hoja Permisos de la planilla, NO este archivo.
   Columnas: tipo | quien | modulo | ver | cargar | borrar | autorizar
     tipo   : "Rol" o "Usuario". Lo de Usuario pisa lo del Rol.
     quien  : el nombre del rol, el usuario, o * para todos.
     modulo : el id del módulo, o * para todos.
     ver/cargar/borrar/autorizar : Sí, No, o vacío (vacío = no lo toco, hereda).
   Reglas:
     - Si a una persona no la alcanza NINGUNA fila, ve todo (no rompe lo que ya andaba).
     - Apenas la alcanza una fila, arranca cerrada y solo se abre lo que digan las filas.
     - El rol Administrador siempre ve todo, para no quedarse afuera de esta misma pantalla.
   Esconder el menú es comodidad, no seguridad: el candado de verdad va en el .gs. */
var ACCIONES = ['ver','cargar','borrar','autorizar'];
function esSi(v){ var s=String(v==null?'':v).trim().toLowerCase(); return s==='si'||s==='sí'||s==='x'||s==='1'||s==='true'||s==='ok'; }
function esNo(v){ var s=String(v==null?'':v).trim().toLowerCase(); return s==='no'||s==='0'||s==='false'||s==='-'; }
function esAdmin(u){ return !!u && /administrador/i.test(String(u.rol||'')); }
function modulosNav(){
  var r=[]; NAV.concat(NAV_OTROS).forEach(function(n){
    if(n.t==='item'){ if(!n.alguno) r.push({id:n.id, txt:n.txt, grupo:'General'}); }
    else if(n.t==='grupo') n.items.forEach(function(i){ r.push({id:i.id, txt:i.txt, grupo:n.txt}); });
  }); return r;
}
function calcularPermisos(u){
  var abierto = { abierto:true, def:{ver:true,cargar:true,borrar:true,autorizar:false}, mod:{} };
  if(!u || esAdmin(u)) return abierto;
  if(!T('Permisos').length) return abierto;   /* todavía nadie cargó una regla: queda como estaba */
  var rol = String(u.rol||'').trim().toLowerCase(), usr = String(u.usuario||'').trim().toLowerCase();
  var esUsuario = function(p){ return String(p.tipo||'').trim().toLowerCase().indexOf('usu')===0; };
  var mias = T('Permisos').filter(function(p){
    var q = String(p.quien||'').trim().toLowerCase();
    if(q==='*') return true;
    return esUsuario(p) ? q===usr : q===rol;
  });
  /* la hoja ya tiene reglas y a esta persona no la alcanza ninguna: no ve nada hasta que la habiliten */
  if(!mias.length) return { abierto:false, def:{ver:false,cargar:false,borrar:false,autorizar:false}, mod:{} };
  /* lo menos específico primero, así lo puntual pisa a lo general */
  var peso = function(p){
    var q = String(p.quien||'').trim().toLowerCase();
    var m = String(p.modulo||'*').trim();
    return (esUsuario(p) ? 4 : (q==='*' ? 0 : 2)) + (m==='*' ? 0 : 1);
  };
  var def = { ver:false, cargar:false, borrar:false, autorizar:false }, mod = {};
  var aplicar = function(p, o){ ACCIONES.forEach(function(a){ if(esSi(p[a])) o[a]=true; else if(esNo(p[a])) o[a]=false; }); };
  mias.slice().sort(function(a,b){ return peso(a)-peso(b); }).forEach(function(p){
    var m = String(p.modulo||'*').trim();
    if(m==='*'){ aplicar(p, def); Object.keys(mod).forEach(function(k){ aplicar(p, mod[k]); }); }
    else {
      if(!mod[m]) mod[m] = { ver:def.ver, cargar:def.cargar, borrar:def.borrar, autorizar:def.autorizar };
      aplicar(p, mod[m]);
    }
  });
  return { abierto:false, def:def, mod:mod };
}
/* si el conector ya manda los permisos resueltos, esos mandan */
function permisos(){ return S.permServidor || calcularPermisos(S.usuario); }
function puede(modulo, accion){
  accion = accion || 'ver';
  var p = permisos();
  if(p.abierto) return accion==='autorizar' ? /gerente|administrador/i.test(String(S.usuario&&S.usuario.rol||'')) : true;
  var m = p.mod[modulo] || p.def;
  return !!m[accion];
}
/* el menú ya filtrado: se caen los grupos vacíos y los títulos que quedaron colgando */
function navVisible(){
  var out = [];
  NAV.forEach(function(x){
    if(x.t==='item'){ if(x.alguno ? x.alguno.some(function(k){ return puede(k,'ver'); }) : puede(x.id,'ver')) out.push(x); }
    else if(x.t==='grupo'){
      var its = x.items.filter(function(i){ return puede(i.id,'ver'); });
      if(its.length) out.push({ t:'grupo', txt:x.txt, items:its });
    }
    else out.push(x);
  });
  return out.filter(function(x,i){
    if(x.t!=='sec') return true;
    var sig = out[i+1];
    return !!sig && sig.t!=='sec';
  });
}

/* del acento salen los tonos claros, para no tener que elegir 4 colores */
function tonos(){
  var hex = acento().replace('#','');
  if(hex.length!==6) return;
  var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  var mez = function(p){ return 'rgb('+Math.round(r+(255-r)*p)+','+Math.round(g+(255-g)*p)+','+Math.round(b+(255-b)*p)+')'; };
  document.documentElement.style.setProperty('--acento-suave', mez(.92));
  document.documentElement.style.setProperty('--acento-borde', mez(.78));
}

/* tabla genérica: cols = [[clave, título, tipo]] tipo: t|n|$|chip|fecha */
function tabla(filas, cols, alClic, acciones){
  var w = el('div',{cls:'tabla-wrap'});
  if(!filas.length){ w.appendChild(el('div',{cls:'vacio'},'<b>Todavía no hay nada cargado</b>Cuando cargues el primer registro aparece acá.')); return w; }
  var t = el('table');
  var thead = el('thead'); var tr = el('tr');
  cols.forEach(function(c){ tr.appendChild(el('th',{cls:(c[2]==='n'||c[2]==='$')?'n':''}, esc(c[1]))); });
  if(acciones && acciones.length) tr.appendChild(el('th',{cls:'n'},'Acciones'));
  thead.appendChild(tr); t.appendChild(thead);
  var tb = el('tbody');
  filas.forEach(function(f){
    var r = el('tr', alClic?{style:'cursor:pointer', onclick:function(){ alClic(f); }}:{});
    cols.forEach(function(c){
      var v = f[c[0]], h;
      if(c[2]==='$') h = pesos(v);
      else if(c[2]==='n') h = miles(v);
      else if(c[2]==='fecha') h = fecha(v);
      else if(c[2]==='chip') h = v ? '<span class="chip '+claseEstado(v)+'">'+esc(v)+'</span>' : '';
      else if(c[2]==='b') h = '<b>'+esc(v)+'</b>';
      else h = esc(v);
      r.appendChild(el('td',{cls:(c[2]==='n'||c[2]==='$')?'n':''}, h));
    });
    if(acciones && acciones.length){
      var td = el('td');
      var caja = el('div',{cls:'acc'});
      acciones.forEach(function(a){
        if(a.si && !a.si(f)) return;
        var b = el('button',{cls:a.cls||'', title:a.t, onclick:function(ev){ ev.stopPropagation(); a.fn(f); }}, ico(ICO[a.ic]||ICO.lapiz));
        caja.appendChild(b);
      });
      td.appendChild(caja); r.appendChild(td);
    }
    tb.appendChild(r);
  });
  t.appendChild(tb); w.appendChild(t);
  return w;
}

function claseEstado(v){
  v = String(v);
  if(/Cerrad|Recibida$|Aceptada$|Vigente|Operativa|Activo|Sí|Conciliada|Pagada|Hecha|Apto$/.test(v)) return 'ok';
  if(/Espera|Esperando|En tránsito|parcial|Por vencer|Emitida|Abierta|En ejecución|Pendiente|Borrador|observación/.test(v)) return 'al';
  if(/Anulad|Rechazad|Vencido|Fuera de servicio|diferencia|Crítica|Siniestrada|Baja/.test(v)) return 'ma';
  if(/En taller|En curso|Alta/.test(v)) return 'in';
  return '';
}

/* PIN de la app del conductor. El PIN NUNCA baja al navegador: la planilla manda
   solo quién tiene PIN propio, y asignar / sacar va por gf=pin_conductor. */
function vistaPinesConductores(m){
  var conPin = {};
  T('PinesConductores').forEach(function(p){ conPin[String(p.dni||'').replace(/\D/g,'')] = true; });
  var filas = porEmpresa(T('Conductores')).map(function(c){
    var o = Object.create(c), d = String(c.dni||'').replace(/\D/g,'');
    o._dni = d;
    o._pin = conPin[d] ? 'PIN propio' : (d ? 'Últimos 4 del DNI ('+d.slice(-4)+')' : 'Sin DNI');
    o._app = conPin[d] ? 'Sí' : 'No';
    return o;
  });
  var mandar = function(c, pin){
    apiPost({accion:'pin_conductor', dni:c._dni, nombre:c.nombre||'', pin:pin}, function(){
      S.db.PinesConductores = (S.db.PinesConductores||[]).filter(function(p){ return String(p.dni||'').replace(/\D/g,'')!==c._dni; });
      if(pin) S.db.PinesConductores.push({dni:c._dni, nombre:c.nombre||'', tiene_pin:'Sí'});
      aviso(pin ? 'PIN asignado a '+(c.nombre||c._dni) : 'PIN sacado: entra con los últimos 4 del DNI');
      pintar();
    }, function(err){ alert(/desconocida/i.test(String(err)) ? 'La planilla tiene el conector viejo: hay que pegar el conector nuevo y publicar Versión NUEVA.' : err); });
  };
  var acc = [];
  if(puede(S.vista,'cargar')){
    acc.push({ t:'Asignar PIN', ic:'lapiz', cls:'ed', fn:function(c){
      if(!c._dni){ alert('Ese conductor no tiene DNI cargado. Cargáselo primero en Conductores.'); return; }
      var p = prompt('PIN nuevo para '+(c.nombre||c._dni)+' (4 a 6 números):', '');
      if(p===null) return;
      p = String(p).trim();
      if(!/^\d{4,6}$/.test(p)){ alert('El PIN tiene que ser de 4 a 6 números.'); return; }
      mandar(c, p);
    }});
    acc.push({ t:'Sacar PIN', ic:'tacho', cls:'bo', fn:function(c){
      if(!conPin[c._dni]){ alert((c.nombre||c._dni)+' no tiene PIN propio: ya entra con los últimos 4 del DNI.'); return; }
      if(!confirm('¿Sacar el PIN propio de '+(c.nombre||c._dni)+'?\n\nVa a volver a entrar con los últimos 4 números de su DNI.')) return;
      mandar(c, '');
    }});
  }
  carta(m, tabla(filas, [['nombre','Conductor','b'],['_dni','DNI'],['_pin','PIN de la app'],['_app','PIN propio','chip']], null, acc));
  m.appendChild(el('div',{cls:'mini'},'Si un conductor no tiene PIN propio, entra a la app con los últimos 4 números de su DNI. '+
    'El PIN no se muestra nunca acá: si alguien lo olvidó, asignale uno nuevo. Los conductores se dan de alta en Conductores.'));
}

/* Dibujo del tren de ejes, visto desde arriba. Rueda simple = un bloque
   por lado; dual = dos bloques juntos, igual que la tabla de clasificación. */
function diagramaEjes(patron, ancho, resaltar){
  var partes = String(patron||'').split(/[-x\/, ]+/).map(function(x){ return num(x); }).filter(function(x){ return x>0; });
  if(!partes.length) return '';
  var w = ancho || 120, sep = 20;
  var h = partes.length * sep + 8;
  var cx = w/2, svg = '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block">';
  svg += '<line x1="'+cx+'" y1="6" x2="'+cx+'" y2="'+(h-6)+'" stroke="#c9cdd3" stroke-width="2"/>';
  partes.forEach(function(cant, i){
    var y = 10 + i*sep, mitad = Math.max(1, Math.round(cant/2));
    svg += '<line x1="14" y1="'+y+'" x2="'+(w-14)+'" y2="'+y+'" stroke="#9aa0a6" stroke-width="2"/>';
    for(var lado=0; lado<2; lado++){
      for(var k=0; k<mitad; k++){
        var xBase = lado===0 ? 6 + k*9 : w - 13 - k*9;
        var pinta = (resaltar && resaltar===i+1) ? 'var(--acento)' : '#3c4043';
        svg += '<rect x="'+xBase+'" y="'+(y-7)+'" width="7" height="14" rx="2" fill="'+pinta+'"/>';
      }
    }
  });
  svg += '</svg>';
  return svg;
}

/* =====================================================================
   NEUMÁTICOS · el neumático es un individuo que vive en un depósito o
   montado en una posición. Montaje, rotación, controles y recapado.
   ===================================================================== */
function posicionesDe(v){
  if(!v) return [];
  var patron = patronDe(String(v.ruedas||'').trim());
  var ejes = num(v.ejes);
  if(!patron){
    if(!ejes) return [];
    patron = []; for(var i=0;i<ejes;i++) patron.push(i===0?2:4); patron = patron.join('-');
  }
  var partes = patron.split(/[-x\/, ]+/).filter(function(x){ return num(x)>0; }).map(function(x){ return num(x); });
  if(!partes.length) return [];
  var out = [], n = 0;
  partes.forEach(function(cant, i){
    var eje = i+1, mitad = cant/2;
    for(var lado=0; lado<2; lado++){
      for(var k=0; k<mitad; k++){
        n++;
        out.push({ n:String(n), eje:eje, lado: lado===0?'I':'D', dual: mitad>1,
          externa: (lado===0 ? k===0 : k===mitad-1),
          etiqueta: 'Eje '+eje+' · '+(lado===0?'izquierda':'derecha')+(mitad>1?(((lado===0?k===0:k===mitad-1))?' externa':' interna'):'') });
      }
    }
  });
  return out;
}
/* dónde está hoy cada cubierta, según el último movimiento */
function montajeActual(){
  var porFuego = {}, porPos = {};
  T('NeumaticosMovs').slice().sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; }).forEach(function(mv){
    if(!mv.fuego) return;
    if(mv.accion==='Montaje'){
      porFuego[mv.fuego] = { interno:String(mv.interno), posicion:String(mv.posicion), fecha:mv.fecha, km:num(mv.km_vehiculo) };
    } else if(/Desmontaje|Baja|recapar|Recapado|Reparación/i.test(String(mv.accion))){
      delete porFuego[mv.fuego];
    }
  });
  Object.keys(porFuego).forEach(function(f){ porPos[porFuego[f].interno+'|'+porFuego[f].posicion] = f; });
  return { porFuego:porFuego, porPos:porPos };
}

    });

      if(S.selNeum && S.selNeum!==f) return montarEn(S.selNeum, p.n);
      if(f){ S.selNeum = (S.selNeum===f?null:f); pintar(); }
    });
    return d;
  }
}

/* ---------------------------- acciones ------------------------------- */
function montarEn(fuego, posicion){
  var n = neumatico(fuego);
  if(!n){ alert('No encuentro la cubierta '+fuego+'.'); return; }
  var mont = montajeActual();
  var ocupa = mont.porPos[String(S.uniSel)+'|'+posicion];
  if(ocupa && ocupa!==fuego){ alert('La posición '+posicion+' ya tiene la cubierta '+ocupa+'. Sacala primero (arrastrala al espacio de transición).'); return; }
  var deDonde = mont.porFuego[fuego];
  var km = kmActual(S.uniSel);
  if(deDonde){
    /* venía montada en otro lado: es una rotación */
    cerrarMontaje(fuego, deDonde, 'Rotación programada', 'Rotación');
  }
  movNeum({ fuego:fuego, accion:'Montaje', interno:S.uniSel, posicion:posicion, km_vehiculo:km,
            km_neumatico:num(n.km_acumulados), profundidad_mm:profActual(n), presion_psi:num(n.presion_ref),
            motivo: deDonde?'Rotación programada':'', base:(unidad(S.uniSel)||{}).base||'' });
  n.estado = 'En uso'; n.deposito = '';
  guardarFila('Neumaticos', n);
  S.transito = (S.transito||[]).filter(function(x){ return x!==fuego; });
  S.selNeum = null;
  guardar(['NeumaticosMovs','Neumaticos']);
}
function sacarDeUnidad(fuego){
  var mont = montajeActual();
  var d = mont.porFuego[fuego];
  if(!d) return;
  cerrarMontaje(fuego, d, '', 'Desmontaje');
  S.transito = S.transito || [];
  if(S.transito.indexOf(fuego)<0) S.transito.push(fuego);
  guardar(['NeumaticosMovs','Neumaticos']);
}
/* escribe el desmontaje y le suma los km rodados a la cubierta */
function cerrarMontaje(fuego, montaje, motivo, accion){
  var n = neumatico(fuego); if(!n) return;
  var km = kmActual(montaje.interno);
  var rodados = Math.max(0, km - num(montaje.km));
  n.km_acumulados = num(n.km_acumulados) + rodados;
  n.estado = 'En stock';
  guardarFila('Neumaticos', n);
  movNeum({ fuego:fuego, accion:accion||'Desmontaje', interno:montaje.interno, posicion:montaje.posicion,
            km_vehiculo:km, km_neumatico:num(n.km_acumulados), profundidad_mm:profActual(n),
            motivo:motivo||'', base:(unidad(montaje.interno)||{}).base||'',
            obs:'Rodó '+miles(rodados)+' km en esta posición' });
}
function desmontarA(fuego, deposito){
  var n = neumatico(fuego); if(!n) return;
  var mont = montajeActual();
  var puesta = mont.porFuego[fuego];
  var cuerpo = el('div');
  var motivo = 'Desgaste normal', prof = profActual(n), dep = deposito;
  var f1 = el('div',{cls:'fila'});
  var sm = el('select'); ((S.listas||{}).motivo_neum||[]).forEach(function(x){ var o=el('option',{value:x},esc(x)); if(x===motivo)o.selected=true; sm.appendChild(o); });
  sm.addEventListener('change', function(e){ motivo=e.target.value; });
  f1.appendChild(el('div',{cls:'campo'},'<label>Motivo</label>').appendChild(sm).parentNode);
  var ip = el('input',{type:'number', step:'0.5', value:prof});
  ip.addEventListener('input', function(e){ prof=num(e.target.value); });
  f1.appendChild(el('div',{cls:'campo'},'<label>Profundidad al sacarla (mm)</label>').appendChild(ip).parentNode);
  var sd = el('select');
  T('NeumDepositos').forEach(function(d){ var o=el('option',{value:d.codigo}, esc(d.nombre+' · '+d.tipo)); if(d.codigo===dep) o.selected=true; sd.appendChild(o); });
  sd.addEventListener('change', function(e){ dep=e.target.value; });
  f1.appendChild(el('div',{cls:'campo'},'<label>¿A qué depósito va?</label>').appendChild(sd).parentNode);
  cuerpo.appendChild(f1);
  cuerpo.appendChild(el('div',{cls:'mini'}, puesta ? ('Está montada en el interno '+puesta.interno+', posición '+puesta.posicion+'.') : 'Está en el depósito, solo cambia de lugar.'));

  modal('Sacar la cubierta '+fuego, cuerpo, [el('button',{cls:'btn pri', onclick:function(){
    var n2 = neumatico(fuego);
    n2.profundidad_actual = prof;
    if(puesta) cerrarMontaje(fuego, puesta, motivo, 'Desmontaje');
    n2 = neumatico(fuego);
    n2.deposito = dep;
    n2.estado = estadoDeDeposito(dep);
    guardarFila('Neumaticos', n2);
    movNeum({ fuego:fuego, accion:'Movimiento de depósito', interno:'', posicion:'', motivo:motivo,
              profundidad_mm:prof, base:(T('NeumDepositos').filter(function(d){ return d.codigo===dep; })[0]||{}).base||'',
              obs:'Queda en '+dep });
    S.transito = (S.transito||[]).filter(function(x){ return x!==fuego; });
    guardar(['NeumaticosMovs','Neumaticos']);
    cerrarModal();
  }},'Confirmar')], 'angosto');
}

/* ----------------------------- 3) LISTADO ---------------------------- */

    var o = Object.create(n);

  g.appendChild(kpi('Capital', pesos(ns.reduce(function(a,n){ return a+num(n.costo); },0)), 'valor de compra'));

function neumControles(m){
  var mont = montajeActual();
  encabezado(m,'','');

  sel.addEventListener('change', function(e){ S.uniSel=e.target.value; pintar(); });

  var tb = el('tbody');
  pos.forEach(function(p){
    var f = mont.porPos[String(S.uniSel)+'|'+p.n];
    var tr = el('tr');
    tr.appendChild(el('td',null,'<b>'+esc(p.n)+'</b><br><span class="mini">'+esc(p.etiqueta)+'</span>'));
    tr.appendChild(el('td',null, f?esc(f):'<span class="mini">libre</span>'));
    ['ext','cen','int','psi'].forEach(function(k){
      var td = el('td',{cls:'n'});
      if(f){
        var i = el('input',{type:'number', step:'0.5', style:'text-align:right'});
        i.addEventListener('input', function(e){ datos[f] = datos[f]||{}; datos[f][k]=num(e.target.value); });
        td.appendChild(i);
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  caja.appendChild(el('div',{cls:'tabla-wrap'}).appendChild(t).parentNode);
  caja.appendChild(el('button',{cls:'btn pri',style:'margin-top:10px', onclick:function(){
    var km = kmActual(S.uniSel), n = 0;
    Object.keys(datos).forEach(function(f){
      var d = datos[f];
      var mins = [d.ext,d.cen,d.int].filter(function(x){ return num(x)>0; });
      if(!mins.length && !num(d.psi)) return;
      var minimo = mins.length ? Math.min.apply(null, mins) : 0;
      var desgaste = 'Parejo';
      if(mins.length===3){
        if(d.ext < d.cen-1.5 && d.ext < d.int-1.5) desgaste='Hombro externo';
        else if(d.int < d.cen-1.5 && d.int < d.ext-1.5) desgaste='Hombro interno';

      if(minimo){ var nn = neumatico(f); if(nn){ nn.profundidad_actual = minimo; guardarFila('Neumaticos', nn); } }
      n++;
    });
    if(!n){ alert('Cargá al menos una medición.'); return; }

  carta(m, tabla(ordenarPor(T('NeumControles'),'fecha'),
    [['fecha','Fecha','fecha'],['fuego','Fuego','b'],['interno','Interno'],['posicion','Pos'],
     ['prof_min','mm mínimo','n'],['presion_psi','Presión','n'],['desgaste','Desgaste','chip'],['km_vehiculo','Km','n']],
    function(f){ formGenerico('NeumControles', f); }), 'Historial de controles');
}

function nuevaOrdenRecapado(){

  if(!pend.length){ alert('No hay cubiertas marcadas como "A recapar". Desmontalas al depósito de recapado primero.'); return; }
  var prov='', marcadas={}, cuerpo = el('div');
  var sp = el('select'); sp.appendChild(el('option',{value:''},'— proveedor —'));
  T('Proveedores').filter(function(p){ return /neum/i.test(p.rubro||'') || true; }).forEach(function(p){ sp.appendChild(el('option',{value:p.codigo}, esc(p.codigo+' · '+p.razon_social))); });
  sp.addEventListener('change', function(e){ prov=e.target.value; });
  cuerpo.appendChild(el('div',{cls:'campo'},'<label>Proveedor de recapado</label>').appendChild(sp).parentNode);
  var t = el('table');
  t.innerHTML = '<thead><tr><th></th><th>Fuego</th><th>Marca</th><th>Medida</th><th class="n">Vida</th></tr></thead>';
  var tb = el('tbody');
  pend.forEach(function(n){
    var tr = el('tr');
    var chk = el('input',{type:'checkbox', style:'width:auto'}); chk.checked = true; marcadas[n.fuego]=true;
    chk.addEventListener('change', function(e){ marcadas[n.fuego]=e.target.checked; });
    tr.appendChild(el('td',null,'').appendChild(chk).parentNode);
    tr.appendChild(el('td',null,'<b>'+esc(n.fuego)+'</b>'));
    tr.appendChild(el('td',null, esc(n.marca||'')));
    tr.appendChild(el('td',null, esc(n.medida||'')));
    tr.appendChild(el('td',{cls:'n'}, num(n.vida)||1));
    tb.appendChild(tr);
  });
  t.appendChild(tb); cuerpo.appendChild(t);
  modal('Nueva orden de recapado', cuerpo, [el('button',{cls:'btn pri', onclick:function(){
    var fuegos = Object.keys(marcadas).filter(function(k){ return marcadas[k]; });
    if(!prov || !fuegos.length){ alert('Elegí proveedor y al menos una cubierta.'); return; }
    var max=0; T('NeumRecapado').forEach(function(o){ var mm=String(o.numero||'').match(/(\d+)$/); if(mm) max=Math.max(max,parseInt(mm[1],10)); });
    var nro='OR-'+('000000'+(max+1)).slice(-6);
    guardarFila('NeumRecapado', { id:idNuevo(), numero:nro, fecha:hoy(), proveedor:prov, estado:'Enviada',
      cantidad:fuegos.length, costo_total:0, fecha_envio:hoy(), fecha_retorno:'', remito:'',
      empresa:(S.empresa!=='*'?S.empresa:''), base:(S.usuario?S.usuario.base:''), obs:'' });
    fuegos.forEach(function(f){
      var n = neumatico(f);
      guardarFila('NeumRecapadoItems', { id:idNuevo(), orden:nro, fuego:f, banda:n.banda||'', costo:0,
        resultado:'', vida_nueva:num(n.vida)+1, obs:'' });
      n.estado = 'En recapado'; guardarFila('Neumaticos', n);
      movNeum({ fuego:f, accion:'A recapar', motivo:'', obs:'Orden '+nro+' · '+prov });
    });
    guardar(['NeumRecapado','NeumRecapadoItems','Neumaticos','NeumaticosMovs']);
    cerrarModal();
  }},'Crear la orden')], 'ancho');
}
function fichaRecapado(o){
  var items = T('NeumRecapadoItems').filter(function(i){ return i.orden===o.numero; });
  var cuerpo = el('div');
  cuerpo.appendChild(el('div',{cls:'card',style:'box-shadow:none;padding:0;margin-bottom:12px'},
    '<table><tbody>'+fila2('Proveedor', esc(o.proveedor))+fila2('Estado','<span class="chip '+claseEstado(o.estado)+'">'+esc(o.estado)+'</span>')+
    fila2('Enviada', fecha(o.fecha_envio))+fila2('Cubiertas', items.length)+'</tbody></table>'));
  cuerpo.appendChild(tabla(items, [['fuego','Fuego','b'],['banda','Banda'],['costo','Costo','$'],
    ['resultado','Resultado','chip'],['vida_nueva','Nueva vida','n']],
    function(f){ formGenerico('NeumRecapadoItems', f, function(){ fichaRecapado(o); }); }));
  var bots = [];
  if(o.estado!=='Recibida') bots.push(el('button',{cls:'btn pri', onclick:function(){
    items.forEach(function(it){
      var n = neumatico(it.fuego); if(!n) return;
      if(/Rechazada|Perdida/i.test(String(it.resultado||''))){ n.estado='Scrap'; n.deposito='SCRAP'; }
      else {
        n.estado='En stock'; n.deposito='STK-PNA'; n.vida = num(it.vida_nueva)||num(n.vida)+1;
        n.tipo='Recapado'; n.profundidad_actual = num(n.profundidad_inicial)||14; n.km_acumulados = 0;
        if(it.banda) n.dibujo = it.banda;
      }
      guardarFila('Neumaticos', n);
      movNeum({ fuego:it.fuego, accion:'Recapado', motivo:'', obs:'Volvió de la orden '+o.numero });
    });
    o.estado='Recibida'; o.fecha_retorno=hoy();
    o.costo_total = items.reduce(function(a,i){ return a+num(i.costo); },0);
    guardarFila('NeumRecapado', o);
    guardar(['NeumRecapado','Neumaticos','NeumaticosMovs']);
    cerrarModal();
  }},'Recibir la orden'));
  bots.push(el('button',{cls:'btn', onclick:function(){ formGenerico('NeumRecapado', o, function(){ fichaRecapado(o); }); }},'Editar'));
  modal('Orden de recapado '+o.numero, cuerpo, bots, 'ancho');
}

/* ---------------------------- 7) INFORMES ---------------------------- */
function neumInformes(m){
  var mont = montajeActual();
  var ns = T('Neumaticos');
  var conKm = ns.filter(function(n){ return num(n.km_acumulados)>0; });
  var costoKm = conKm.length ? conKm.reduce(function(a,n){ return a + num(n.costo)/num(n.km_acumulados); },0)/conKm.length : 0;
  var g = el('div',{cls:'grid g4'});
  g.appendChild(kpi('Costo por km', costoKm?('$'+costoKm.toFixed(2)):'—', 'promedio de la flota'));
  g.appendChild(kpi('Vida promedio', conKm.length?miles(Math.round(conKm.reduce(function(a,n){ return a+num(n.km_acumulados); },0)/conKm.length)):'—', 'km por cubierta'));
  g.appendChild(kpi('En recapado', miles(ns.filter(function(n){ return n.estado==='En recapado'; }).length), 'afuera'));
  g.appendChild(kpi('Scrap', miles(ns.filter(function(n){ return n.estado==='Scrap'; }).length), 'dadas de baja'));
  m.appendChild(g);

  var porMarca = {};
  ns.forEach(function(n){
    var k = n.marca||'Sin marca';
    if(!porMarca[k]) porMarca[k] = { marca:k, cant:0, km:0, costo:0 };
    porMarca[k].cant++; porMarca[k].km += num(n.km_acumulados); porMarca[k].costo += num(n.costo);
  });
  carta(m, tabla(Object.keys(porMarca).map(function(k){
      var r = porMarca[k]; r.kmProm = r.cant? Math.round(r.km/r.cant):0;
      r.costoKm = r.km ? Math.round(r.costo/r.km*100)/100 : 0; return r;
    }), [['marca','Marca','b'],['cant','Cubiertas','n'],['kmProm','Km promedio','n'],['costoKm','$/km','$']]),
    'Rendimiento por marca · con esto se decide qué comprar');

  var alerta = [];
  ns.forEach(function(n){
    var d = mont.porFuego[n.fuego];
    if(profActual(n) && profActual(n)<=4) alerta.push({ fuego:n.fuego, motivo:'Al límite ('+profActual(n)+' mm)', donde: d?('interno '+d.interno+' pos '+d.posicion):(n.deposito||'') });
    if(d && num(n.km_acumulados)>0 && num(n.km_acumulados)%50000 < 3000) alerta.push({ fuego:n.fuego, motivo:'Toca rotación', donde:'interno '+d.interno+' pos '+d.posicion });
  });
  carta(m, tabla(alerta, [['fuego','Cubierta','b'],['motivo','Alerta'],['donde','Dónde está']]), 'Alertas de desgaste y rotación');
}

function fichaNeumatico(fuego){
  var n = neumatico(fuego); if(!n) return;
  var mont = montajeActual(), d = mont.porFuego[fuego];
  var movs = T('NeumaticosMovs').filter(function(x){ return String(x.fuego)===String(fuego); });

    '<div class="kpi"><div class="et">Dónde está</div><div class="nu" style="font-size:17px">'+(d?('Interno '+esc(d.interno)):esc(n.deposito||'sin ubicar'))+'</div><div class="pie">'+(d?('posición '+esc(d.posicion)):esc(n.estado||''))+'</div></div>'+
    '<div class="kpi"><div class="et">Profundidad</div><div class="nu" style="font-size:17px">'+profActual(n)+' mm</div><div class="pie">arrancó en '+num(n.profundidad_inicial)+' mm</div></div>'+
    '<div class="kpi"><div class="et">Kilómetros</div><div class="nu" style="font-size:17px">'+miles(n.km_acumulados)+'</div><div class="pie">'+(num(n.km_acumulados)?('$'+(num(n.costo)/num(n.km_acumulados)).toFixed(2)+' por km'):'sin rodar')+'</div></div>'));
  cuerpo.appendChild(el('div',{cls:'card',style:'box-shadow:none;padding:0;margin-bottom:12px'},
    '<table><tbody>'+
    fila2('Cubierta', esc(n.marca||'')+' '+esc(n.medida||'')+' · '+esc(n.dibujo||''))+
    fila2('Vida', (num(n.vida)||1)+'ª · '+esc(n.tipo||''))+
    fila2('Serie / DOT', esc(n.serie_dot||'—'))+
    fila2('Costo', pesos(n.costo))+
    '</tbody></table>'));
  cuerpo.appendChild(el('b',null,'Historia'));
  cuerpo.appendChild(tabla(ordenarPor(movs,'fecha'), [['fecha','Fecha','fecha'],['accion','Acción','chip'],
    ['interno','Interno'],['posicion','Pos'],['km_vehiculo','Km unidad','n'],['profundidad_mm','mm','n'],['motivo','Motivo']]));
  if(ctrl.length){
    cuerpo.appendChild(el('b',null,'Controles'));
    cuerpo.appendChild(tabla(ordenarPor(ctrl,'fecha'), [['fecha','Fecha','fecha'],['prof_ext','Ext','n'],
      ['prof_cen','Centro','n'],['prof_int','Int','n'],['presion_psi','Presión','n'],['desgaste','Desgaste']]));
  }
  var bots = [el('button',{cls:'btn', onclick:function(){ formGenerico('Neumaticos', n); }},'Editar')];
  if(d) bots.push(el('button',{cls:'btn pri', onclick:function(){ cerrarModal(); desmontarA(fuego, 'STK-PNA'); }},'Desmontar'));
  modal('Cubierta '+fuego, cuerpo, bots, 'ancho');
}

function vistaVehiculos(m){
  var sub = S.sub || 'unidades';
  encabezado(m,'Vehículos','Parque móvil y vencimientos', sub==='unidades'
    ? [btnMasiva('Vehiculos'), btnNuevo('Vehiculos','Nueva unidad',{estado:'Operativa'})]
    : [btnMasiva('Documentacion'), btnNuevo('Documentacion','Nuevo documento',{alcance:'Vehículo', estado:'Vigente'})]);
  tabs(m,[['unidades','Unidades'],['doc','Vencimientos y habilitaciones']], sub, function(v){ S.sub=v; pintar(); });
  var c = el('div',{cls:'card'});
  if(sub==='unidades'){
    var barra = el('div',{style:'display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px'});
    var busca = el('input',{placeholder:'buscar por interno, patente, marca o modelo…', value:S.buscar||''});
    busca.addEventListener('input', function(e){ S.buscar=e.target.value; dib(); });
    var selE = el('select',{style:'max-width:210px'});
    selE.appendChild(el('option',{value:''},'Todos los estados'));
    ['Operativa','En taller','Fuera de servicio','Reservada','Vendida'].forEach(function(x){
      var o=el('option',{value:x},esc(x)); if(S.filtroEstado===x)o.selected=true; selE.appendChild(o); });
    selE.addEventListener('change', function(e){ S.filtroEstado=e.target.value; dib(); });
    barra.appendChild(busca); barra.appendChild(selE); c.appendChild(barra);
    var caja = el('div'); c.appendChild(caja);
    var dib = function(){
      var q = normTexto(S.buscar||'');
      var filas = porEmpresa(T('Vehiculos')).filter(function(v){
        if(S.filtroEstado && S.filtroEstado!=='__abiertas' && v.estado!==S.filtroEstado) return false;
        if(!q) return true;
        return normTexto([v.vehiculo,v.patente,v.marca,v.modelo,v.base].join(' ')).indexOf(q)>=0;
      }).map(function(v){
        var o = Object.create(v), ps = proximoServicio(v), cons = consumoReal(v.vehiculo);
        o._km = kmActual(v.vehiculo);
        o._prox = ps ? (ps.codigo+' en '+miles(ps.falta)+' km') : '—';
        o._modelo = (v.marca||'')+' '+(v.modelo||'');
        o._consumo = cons ? cons.toFixed(1)+' L/100' : '—';
        o._ejes = v.ruedas ? nombreConfig(v.ruedas) : '—';
        if(cons && num(v.consumoRef)){
          var dd = (cons-num(v.consumoRef))/num(v.consumoRef);
          o._consumo += dd>.2 ? ' ▲' : (dd<-.1 ? ' ▼' : '');
        }
        return o;
      });
      caja.innerHTML='';
      caja.appendChild(tabla(filas, [['vehiculo','Interno','b'],['patente','Patente'],['_modelo','Marca y modelo'],
        ['base','Base'],['_km','Odómetro','n'],['_consumo','Consumo'],['_ejes','Ejes'],['_prox','Próximo servicio'],['estado','Estado','chip']],
        function(f){ fichaUnidad(f.vehiculo); },
        accionesDe('Vehiculos', { ver:function(f){ fichaUnidad(f.vehiculo); },
          extra:[{ t:'Configuración de ejes', ic:'rueda', fn:function(f){ formGenerico('Vehiculos', f); } }] })));
      caja.appendChild(el('div',{cls:'mini',style:'margin-top:8px'}, filas.length+' de '+porEmpresa(T('Vehiculos')).length+' unidades · ▲ consume más de 20% por encima de la referencia'));
    };
    dib();
  } else {
    var docs = vencimientos().map(function(v){
      var o = { ref:v.ref, tipo:v.tipo, vence:v.vence, origen:v.origen, _fila:v.fila };
      var dd = dias(hoy(), v.vence);
      o._plazo = isNaN(dd) ? '—' : (dd<0 ? 'vencido hace '+(-dd)+' d' : 'faltan '+dd+' d');
      o._est = isNaN(dd) ? '' : (dd<0 ? 'Vencido' : (dd<=30 ? 'Por vencer' : 'Vigente'));
      return o;
    });
    var vencidos = docs.filter(function(d){ return d._est==='Vencido'; }).length;
    var g = el('div',{cls:'grid g4', style:'margin-bottom:14px'});
    g.appendChild(kpi('Vencimientos', miles(docs.length), 'de unidades, choferes y papeles'));
    g.appendChild(kpi('Vencidos', miles(vencidos), 'meta: cero', vencidos>0));
    g.appendChild(kpi('Vencen en 30 días', miles(docs.filter(function(d){ return d._est==='Por vencer'; }).length), 'hay que sacar turno'));
    c.appendChild(g);
    c.appendChild(tabla(docs, [['ref','Unidad / persona','b'],['tipo','Documento'],['vence','Vence','fecha'],
      ['_plazo','Plazo'],['_est','Estado','chip'],['origen','Está cargado en']],
      function(f){ formGenerico(f.origen, f._fila); }));
  }
  m.appendChild(c);
}

/* -------- Almacén y compras: vive en su propio archivo (almacen.html) --------
   Las empresas, bases y unidades siguen siendo las de acá: al abrirlo se le
   dejan armadas en el navegador (ver contextoAlmacen). */
function maestrosParaModulo(){
  var empresas = T('Empresas').filter(function(e){ return e.activa!=='No'; }).map(function(e){
    return { id:String(e.id||e.codigo), nombre:e.nombre||e.codigo, alias:e.codigo||'', cuit:e.cuit||'', color:acento() };
  });
  var porCodigo = {};
  T('Empresas').forEach(function(e){ if(e.codigo) porCodigo[String(e.codigo).trim().toUpperCase()] = String(e.id||e.codigo); });
  var bases = T('Bases').filter(function(b){ return b.activa!=='No'; }).map(function(b){
    return { id:String(b.id||b.codigo), empresaId:porCodigo[String(b.empresa||'').trim().toUpperCase()]||'',
             nombre:b.nombre||b.codigo, tipo:b.nivel||'', localidad:b.localidad||'' };
  });
  var unidades = T('Vehiculos').map(function(v){
    return { id:String(v.id), empresaId:porCodigo[String(v.empresa||'').trim().toUpperCase()]||'',
             baseId:'', interno:v.vehiculo||'', patente:v.patente||'',
             marca:v.marca||'', modelo:v.modelo||'' };
  });
  return { empresas:empresas, bases:bases, unidades:unidades };
}

function vistaPermisos(m){
  var hayHoja = !!(S.esq||{}).Permisos;
  var roles = {}; T('Usuarios').forEach(function(u){ if(u.rol) roles[String(u.rol).trim()] = true; });

function verFilasPermisos(tipo, quien){
  var li = ['tipo\tquien\tmodulo\tver\tcargar\tborrar\tautorizar'];
  Object.keys(S.permEst||{}).forEach(function(mo){
    var e = S.permEst[mo];
    if(!e.ver && !e.cargar && !e.borrar && !e.autorizar) return;
    li.push([tipo, quien, mo, e.ver?'Sí':'No', e.cargar?'Sí':'No', e.borrar?'Sí':'No', e.autorizar?'Sí':'No'].join('\t'));
  });
  var cuerpo = el('div');

  modal('Filas de permisos · '+quien, cuerpo, [], 'ancho');
}

/* ---- código de acceso de Mi empresa ----
   Parámetro clave_miempresa de la planilla. Si está cargado, esta pantalla lo
   pide al entrar, sea quien sea el usuario, y el conector no deja guardar en
   las hojas de Mi empresa hasta que la sesión lo escribió bien. */
/* El código vive en el conector (GF_CLAVE_MIEMPRESA, arriba del bloque de
   permisos del .gs). Mi empresa lo pide CADA vez que se entra. Si el conector
   es viejo y no lo conoce, vale el de fábrica. */
var CLAVE_CONFIG_DEFECTO = '1234';
function exigeClaveConfig(){ return S.claveConfigServidor===false ? false : true; }
function pantallaClaveConfig(m){
  encabezado(m,'Mi empresa','Empresas, bases, usuarios y la conexión con la planilla');
  var c = el('div',{cls:'card', style:'max-width:420px;margin:30px auto;text-align:center'});
  c.innerHTML = '<div class="h1" style="font-size:17px;margin-bottom:4px">Código de acceso</div><div class="sub" style="margin-bottom:14px">Para entrar a Mi empresa hay que escribir el código.</div>';
  if(S.error){ c.appendChild(el('div',{cls:'err'}, esc(S.error))); S.error=''; }
  var inp = el('input',{type:'password', cls:'pin codigo', maxlength:'40', placeholder:'••••••', autocomplete:'off'});
  c.appendChild(inp);
  var seguir = function(){
    var v = inp.value.trim(); if(!v) return;
    var listo = function(){ S.cfgOk = true; S.error=''; pintar(); };
    var fabrica = function(){ if(v===CLAVE_CONFIG_DEFECTO) listo(); else { S.error='Código de acceso incorrecto.'; pintar(); } };
    if(S.token){                       /* lo revisa el conector contra GF_CLAVE_MIEMPRESA */
      apiGet({accion:'clave_config', clave:v}, function(){ listo(); }, function(err){
        if(/incorrecto|vencida/i.test(String(err))){ S.error = err; pintar(); } else fabrica();   /* conector viejo */
      });
    } else fabrica();
  };
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') seguir(); });
  c.appendChild(el('div',{style:'height:10px'}));
  c.appendChild(el('button',{cls:'btn pri', style:'width:100%;justify-content:center', onclick:seguir},'Entrar a Mi empresa'));
  c.appendChild(el('div',{cls:'mini',style:'margin-top:12px'},'Es un código aparte del PIN y se pide cada vez que entrás a Mi empresa. Se cambia en el conector de la planilla (línea GF_CLAVE_MIEMPRESA).'));
  m.appendChild(c);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 50);
}
